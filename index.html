<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Choice Writer</title>
    <style>
        /* Force the app to fit the screen exactly without scrolling */
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 10px 20px;
            margin: 0;
            color: #333;
            height: 100vh; /* 100% of Viewport Height */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent full page scrolling */
        }
        
        h1 { 
            color: #00796b; 
            margin: 10px 0;
            font-size: clamp(24px, 4vw, 32px); /* Scales font size down on smaller screens */
        }
        
        .controls-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 5px 0;
        }

        /* The Sentence Box now expands to fill the middle space */
        #sentence-box {
            background: white;
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            flex-grow: 1; /* Pushes everything else to top and bottom */
            padding: 20px;
            font-size: clamp(24px, 4vw, 36px);
            margin: 10px auto;
            width: 100%;
            max-width: 900px;
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.5;
            overflow-y: auto; /* If sentence gets HUGE, only this box scrolls */
            white-space: pre-wrap; /* Forces spaces to be respected */
        }

        button {
            font-family: inherit;
            font-size: clamp(16px, 2.5vw, 22px);
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px #999;
        }
        
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0px #999;
        }

        #listen-btn { background-color: #4CAF50; color: white; box-shadow: 0 4px #388E3C; font-weight: bold; }
        #listen-btn:active { box-shadow: 0 0px #388E3C; }
        
        .punct-btn { background-color: #FF9800; color: white; box-shadow: 0 4px #F57C00; }
        .punct-btn:active { box-shadow: 0 0px #F57C00; }
        
        .action-btn { background-color: #2196F3; color: white; box-shadow: 0 4px #1976D2; }
        .action-btn:active { box-shadow: 0 0px #1976D2; }
        
        #clear-btn { background-color: #f44336; color: white; box-shadow: 0 4px #d32f2f; }
        #clear-btn:active { box-shadow: 0 0px #d32f2f; }
        
        #read-sentence-btn { background-color: #9c27b0; color: white; box-shadow: 0 4px #7b1fa2; }
        #read-sentence-btn:active { box-shadow: 0 0px #7b1fa2; }
        
        #options-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 100px;
            margin: 10px 0;
            flex-wrap: nowrap; /* Keep on one line to fit screen */
        }

        .option-btn {
            background-color: #9c27b0;
            color: white;
            box-shadow: 0 4px #7b1fa2;
            font-size: clamp(20px, 4vw, 32px); /* Scales dynamically */
            padding: 15px 30px;
            flex: 1; /* Stretches buttons evenly */
            max-width: 30%;
            animation: popIn 0.3s ease-out;
            word-wrap: break-word; /* Prevents long words breaking layout */
        }
        .option-btn:active { box-shadow: 0 0px #7b1fa2; }

        #status {
            font-size: clamp(16px, 2.5vw, 20px);
            color: #555;
            font-weight: bold;
            min-height: 30px;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>🎙️ Voice Choice Writer ✍️</h1>
    
    <!-- Top Controls -->
    <div class="controls-group">
        <button id="listen-btn">🎤 Start Listening</button>
        <button id="comma-btn" class="punct-btn">, Comma</button>
        <button id="period-btn" class="punct-btn">. Full Stop</button>
    </div>

    <!-- The Sentence -->
    <div id="sentence-box"></div>
    
    <!-- Bottom Controls -->
    <div class="controls-group">
        <button id="read-sentence-btn">🔊 Read Sentence</button>
        <button id="copy-btn" class="action-btn">📋 Copy to Docs</button>
        <button id="clear-btn">🗑️ Clear</button>
    </div>

    <div id="status">Click "Start Listening" to begin!</div>
    
    <!-- Choices appear here -->
    <div id="options-container"></div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isAutoListening = false;
        
        if (!SpeechRecognition) {
            document.getElementById('status').innerText = "Oops! Your browser doesn't support voice typing. Try Google Chrome!";
        } else {
            recognition = new SpeechRecognition();
            recognition.maxAlternatives = 3; 
            recognition.continuous = false; 
            recognition.interimResults = false;
            recognition.lang = 'en-GB';

            const listenBtn = document.getElementById('listen-btn');
            const commaBtn = document.getElementById('comma-btn');
            const periodBtn = document.getElementById('period-btn');
            const copyBtn = document.getElementById('copy-btn');
            const clearBtn = document.getElementById('clear-btn');
            const readSentenceBtn = document.getElementById('read-sentence-btn');
            const sentenceBox = document.getElementById('sentence-box');
            const optionsContainer = document.getElementById('options-container');
            const statusText = document.getElementById('status');

            // --- FUNCTIONS --- //

            function triggerListen() {
                try {
                    recognition.start();
                    statusText.innerText = "Listening... speak your word! 👂";
                    listenBtn.style.backgroundColor = "#FFEB3B"; 
                    listenBtn.style.color = "#333";
                    listenBtn.innerText = "Listening...";
                } catch (e) {
                    // Ignore if already started
                }
            }

            function stopListeningUI() {
                listenBtn.style.backgroundColor = "#4CAF50";
                listenBtn.style.color = "white";
                listenBtn.innerText = "🎤 Start Listening";
            }

            function addPunctuation(mark) {
                // Using textContent and forcing a space prevents the missing space bug
                let text = sentenceBox.textContent;
                if (text.endsWith(' ')) {
                    text = text.slice(0, -1);
                }
                sentenceBox.textContent = text + mark + ' ';
            }

            function speakWord(word) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.rate = 0.8; 
                    window.speechSynthesis.speak(utterance);
                }
            }

            // --- BUTTON CLICKS --- //

            listenBtn.addEventListener('click', () => {
                optionsContainer.innerHTML = '';
                isAutoListening = true;
                triggerListen();
            });

            commaBtn.addEventListener('click', () => {
                addPunctuation(',');
                if (isAutoListening) triggerListen(); 
            });

            periodBtn.addEventListener('click', () => {
                addPunctuation('.');
                isAutoListening = false; 
                statusText.innerText = "Sentence complete! Ready for a new one.";
                optionsContainer.innerHTML = '';
                stopListeningUI();
            });

            copyBtn.addEventListener('click', () => {
                const text = sentenceBox.textContent.trim();
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        const originalText = copyBtn.innerText;
                        copyBtn.innerText = "✅ Copied!";
                        setTimeout(() => copyBtn.innerText = originalText, 2500);
                    });
                }
            });

            clearBtn.addEventListener('click', () => {
                sentenceBox.textContent = '';
                optionsContainer.innerHTML = '';
                isAutoListening = false;
                statusText.innerText = "Cleared. Click start when ready.";
                stopListeningUI();
            });

            readSentenceBtn.addEventListener('click', () => {
                const text = sentenceBox.textContent.trim();
                if (text) {
                    speakWord(text); // Reusing the speech function for the whole sentence
                }
            });

            // --- SPEECH RECOGNITION LOGIC --- //

            recognition.onresult = (event) => {
                const results = event.results[0];
                optionsContainer.innerHTML = ''; 
                statusText.innerText = "Pick the right word! (Hover to hear) 👇";
                stopListeningUI();

                let uniqueWords = new Set();
                
                for (let i = 0; i < results.length; i++) {
                    let word = results[i].transcript.trim().toLowerCase();
                    word = word.replace(/[.,!?]/g, ''); 
                    
                    if (word && !uniqueWords.has(word)) {
                        uniqueWords.add(word);
                        
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.innerText = word;
                        
                        btn.onmouseenter = () => speakWord(word);

                        btn.onclick = () => {
                            if (sentenceBox.textContent.length === 0 || sentenceBox.textContent.endsWith('. ')) {
                                word = word.charAt(0).toUpperCase() + word.slice(1);
                            }
                            
                            // Using textContent to preserve the trailing spaces
                            sentenceBox.textContent += word + ' ';
                            optionsContainer.innerHTML = '';
                            
                            if (isAutoListening) {
                                statusText.innerText = "Great! Getting ready for next word...";
                                setTimeout(() => {
                                    if (isAutoListening) triggerListen();
                                }, 800);
                            } else {
                                statusText.innerText = "Word added.";
                            }
                        };
                        
                        optionsContainer.appendChild(btn);
                        if (uniqueWords.size === 3) break; 
                    }
                }

                if (uniqueWords.size === 0) {
                    statusText.innerText = "Didn't catch that. Try again!";
                    if (isAutoListening) {
                        setTimeout(triggerListen, 1500);
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    statusText.innerText = "Didn't hear anything. Taking a break.";
                    isAutoListening = false;
                    stopListeningUI();
                } else {
                    statusText.innerText = "Error: " + event.error;
                    isAutoListening = false;
                    stopListeningUI();
                }
            };

            recognition.onend = () => {
                if (optionsContainer.innerHTML === '' && !isAutoListening) {
                    stopListeningUI();
                }
            };
        }
    </script>
</body>
</html>
