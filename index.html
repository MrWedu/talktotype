<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Choice Writer</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 10px 20px;
            margin: 0;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        h1 { 
            color: #00796b; 
            margin: 8px 0;
            font-size: clamp(22px, 3.5vw, 30px);
        }
        
        .controls-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 5px 0;
        }

        #sentence-box {
            background: white;
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            flex-grow: 1;
            padding: 20px;
            font-size: clamp(24px, 4vw, 36px);
            margin: 8px auto;
            width: 100%;
            max-width: 900px;
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        button {
            font-family: inherit;
            font-size: clamp(16px, 2.5vw, 22px);
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px #999;
        }
        
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0px #999;
        }

        #listen-btn { background-color: #4CAF50; color: white; box-shadow: 0 4px #388E3C; font-weight: bold; }
        #stop-btn { background-color: #e91e63; color: white; box-shadow: 0 4px #c2185b; font-weight: bold; }
        .punct-btn { background-color: #FF9800; color: white; box-shadow: 0 4px #F57C00; }
        .action-btn { background-color: #2196F3; color: white; box-shadow: 0 4px #1976D2; }
        #clear-btn { background-color: #f44336; color: white; box-shadow: 0 4px #d32f2f; }
        #read-sentence-btn { background-color: #9c27b0; color: white; box-shadow: 0 4px #7b1fa2; }
        
        #options-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 90px;
            margin: 8px 0;
            flex-wrap: nowrap;
        }

        .option-btn {
            background-color: #9c27b0;
            color: white;
            box-shadow: 0 4px #7b1fa2;
            font-size: clamp(20px, 4vw, 32px);
            padding: 15px 25px;
            flex: 1;
            max-width: 32%;
            animation: popIn 0.3s ease-out;
            word-wrap: break-word;
        }

        #status {
            font-size: clamp(16px, 2.5vw, 20px);
            color: #555;
            font-weight: bold;
            min-height: 28px;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>🎙️ Voice Choice Writer ✍️</h1>
    
    <!-- Controls Top -->
    <div class="controls-group">
        <button id="listen-btn">🎤 Start Listening</button>
        <button id="stop-btn">🛑 Stop Listening</button>
        <button id="comma-btn" class="punct-btn">, Comma</button>
        <button id="period-btn" class="punct-btn">. Full Stop</button>
    </div>

    <!-- Sentence Output -->
    <div id="sentence-box"></div>
    
    <!-- Controls Bottom -->
    <div class="controls-group">
        <button id="read-sentence-btn">🔊 Read Sentence</button>
        <button id="copy-btn" class="action-btn">📋 Copy to Docs</button>
        <button id="clear-btn">🗑️ Clear</button>
    </div>

    <div id="status">Click "Start Listening" when ready!</div>
    
    <div id="options-container"></div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isAutoListening = false;
        let isListeningActive = false;
        let restartTimer = null;
        
        if (!SpeechRecognition) {
            document.getElementById('status').innerText = "Oops! Your browser doesn't support voice typing. Try Google Chrome!";
        } else {
            recognition = new SpeechRecognition();
            recognition.maxAlternatives = 3; 
            recognition.continuous = false; 
            recognition.interimResults = false;
            recognition.lang = 'en-GB';

            const listenBtn = document.getElementById('listen-btn');
            const stopBtn = document.getElementById('stop-btn');
            const commaBtn = document.getElementById('comma-btn');
            const periodBtn = document.getElementById('period-btn');
            const copyBtn = document.getElementById('copy-btn');
            const clearBtn = document.getElementById('clear-btn');
            const readSentenceBtn = document.getElementById('read-sentence-btn');
            const sentenceBox = document.getElementById('sentence-box');
            const optionsContainer = document.getElementById('options-container');
            const statusText = document.getElementById('status');

            function safeStartListen() {
                if (!isAutoListening) return;
                clearTimeout(restartTimer);

                // If Text-to-Speech is speaking, wait for it to finish first!
                if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                    statusText.innerText = "Waiting for audio to finish...";
                    restartTimer = setTimeout(safeStartListen, 300);
                    return;
                }

                if (isListeningActive) return;

                try {
                    recognition.start();
                } catch (e) {
                    // Engine still resetting, try again in 300ms
                    restartTimer = setTimeout(safeStartListen, 300);
                }
            }

            function stopAllListening() {
                isAutoListening = false;
                isListeningActive = false;
                clearTimeout(restartTimer);
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                try {
                    recognition.stop();
                } catch (e) {}
                stopListeningUI();
            }

            function stopListeningUI() {
                listenBtn.style.backgroundColor = "#4CAF50";
                listenBtn.style.color = "white";
                listenBtn.innerText = "🎤 Start Listening";
            }

            function updateListeningUI() {
                listenBtn.style.backgroundColor = "#FFEB3B"; 
                listenBtn.style.color = "#333";
                listenBtn.innerText = "🔴 Listening Active";
            }

            function addPunctuation(mark) {
                let text = sentenceBox.textContent;
                if (text.endsWith(' ')) {
                    text = text.slice(0, -1);
                }
                sentenceBox.textContent = text + mark + ' ';
            }

            function speakText(text, callback) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Stop prior audio
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.85; 
                    if (callback) {
                        utterance.onend = callback;
                        utterance.onerror = callback;
                    }
                    window.speechSynthesis.speak(utterance);
                } else if (callback) {
                    callback();
                }
            }

            // --- BUTTON HANDLERS --- //

            listenBtn.addEventListener('click', () => {
                optionsContainer.innerHTML = '';
                isAutoListening = true;
                safeStartListen();
            });

            stopBtn.addEventListener('click', () => {
                stopAllListening();
                statusText.innerText = "Listening stopped. Click Start when ready.";
                optionsContainer.innerHTML = '';
            });

            commaBtn.addEventListener('click', () => {
                addPunctuation(',');
                if (isAutoListening) {
                    restartTimer = setTimeout(safeStartListen, 300);
                }
            });

            periodBtn.addEventListener('click', () => {
                addPunctuation('.');
                stopAllListening();
                statusText.innerText = "Sentence complete! Ready for a new one.";
                optionsContainer.innerHTML = '';
            });

            copyBtn.addEventListener('click', () => {
                const text = sentenceBox.textContent.trim();
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        const originalText = copyBtn.innerText;
                        copyBtn.innerText = "✅ Copied!";
                        setTimeout(() => copyBtn.innerText = originalText, 2500);
                    });
                }
            });

            clearBtn.addEventListener('click', () => {
                sentenceBox.textContent = '';
                optionsContainer.innerHTML = '';
                stopAllListening();
                statusText.innerText = "Cleared. Click Start Listening when ready.";
            });

            readSentenceBtn.addEventListener('click', () => {
                const text = sentenceBox.textContent.trim();
                if (text) {
                    // Temporarily pause mic to read full sentence cleanly
                    const wasAuto = isAutoListening;
                    isAutoListening = false;
                    try { recognition.stop(); } catch(e){}
                    
                    speakText(text, () => {
                        if (wasAuto) {
                            isAutoListening = true;
                            safeStartListen();
                        }
                    });
                }
            });

            // --- RECOGNITION EVENTS --- //

            recognition.onstart = () => {
                isListeningActive = true;
                updateListeningUI();
                statusText.innerText = "🔴 Listening... Speak your word now! 👂";
            };

            recognition.onresult = (event) => {
                const results = event.results[0];
                optionsContainer.innerHTML = ''; 
                statusText.innerText = "Pick the right word! (Hover to hear) 👇";

                let uniqueWords = new Set();
                
                for (let i = 0; i < results.length; i++) {
                    let word = results[i].transcript.trim().toLowerCase();
                    word = word.replace(/[.,!?]/g, ''); 
                    
                    if (word && !uniqueWords.has(word)) {
                        uniqueWords.add(word);
                        
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.innerText = word;
                        
                        btn.onmouseenter = () => {
                            // Only speak on hover if mic is not actively recording
                            if (!isListeningActive) speakText(word);
                        };

                        btn.onclick = () => {
                            if (sentenceBox.textContent.length === 0 || sentenceBox.textContent.endsWith('. ')) {
                                word = word.charAt(0).toUpperCase() + word.slice(1);
                            }
                            
                            sentenceBox.textContent += word + ' ';
                            optionsContainer.innerHTML = '';
                            
                            if (isAutoListening) {
                                statusText.innerText = "Word added! Preparing mic...";
                                // Give a small gap, then trigger mic safely
                                restartTimer = setTimeout(safeStartListen, 400);
                            } else {
                                statusText.innerText = "Word added.";
                            }
                        };
                        
                        optionsContainer.appendChild(btn);
                        if (uniqueWords.size === 3) break; 
                    }
                }

                if (uniqueWords.size === 0) {
                    statusText.innerText = "Didn't catch that. Trying again...";
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 600);
                    }
                }
            };

            recognition.onerror = (event) => {
                isListeningActive = false;
                if (event.error === 'no-speech') {
                    statusText.innerText = "No speech detected. Listening again...";
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 400);
                    }
                } else if (event.error === 'aborted') {
                    // Intentionally stopped
                } else {
                    statusText.innerText = "Mic status: " + event.error;
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 800);
                    }
                }
            };

            recognition.onend = () => {
                isListeningActive = false;
                if (isAutoListening) {
                    // If recognition ended naturally, cue the next run safely
                    restartTimer = setTimeout(safeStartListen, 300);
                } else {
                    stopListeningUI();
                }
            };
        }
    </script>
</body>
</html>
