<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Choice Writer</title>
    <style>
        /* Import Lexend font, designed specifically to improve reading fluency and accessibility */
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap');

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Lexend', Verdana, Tahoma, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 12px;
            margin: 0;
            color: #222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        h1 { 
            color: #00796b; 
            margin: 0 0 8px 0;
            font-size: clamp(20px, 3vw, 26px);
            flex-shrink: 0;
        }

        /* High Contrast Toggle - Top Right Corner */
        #contrast-toggle-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: #37474f;
            color: white;
            box-shadow: 0 3px #263238;
            font-size: 22px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            z-index: 100;
        }

        .app-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            flex-grow: 1;
            height: calc(100% - 40px);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
        }

        .edit-header {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            background: #b2dfdb;
            padding: 6px 12px;
            border-radius: 10px;
            border: 2px solid #00796b;
            flex-wrap: wrap;
        }

        .mode-btn {
            background-color: #00796b;
            color: white;
            font-weight: bold;
            box-shadow: 0 3px #004d40;
            padding: 6px 14px;
            flex: 1;
            min-width: 130px;
        }

        #sentence-box {
            background: white;
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            flex-grow: 1;
            padding: 18px;
            font-size: clamp(22px, 3.2vw, 30px);
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            outline: none;
            transition: all 0.3s ease;
        }

        /* CHILD EDIT MODE STYLES */
        #sentence-box.child-edit-active {
            border: 4px solid #ff9800 !important;
            background-color: #fff8e1 !important;
            white-space: normal;
        }
        
        .child-gap {
            display: inline-block;
            width: 20px;
            height: 28px;
            margin: 0 2px;
            background-color: #e0f2f1;
            border-radius: 4px;
            cursor: pointer;
            vertical-align: middle;
            transition: background 0.2s;
        }
        .child-gap:hover { background-color: #b2dfdb; }
        
        .child-word {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .child-word:hover {
            background-color: #fff9c4;
            border-color: #fbc02d;
        }

        /* SEPARATE PUNCTUATION SPAN STYLING (Soft look matching blank spaces) */
        .child-punct {
            display: inline-block;
            padding: 2px 6px;
            margin: 0 1px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 900;
            color: #222222;
            background-color: #e0f2f1;
            border: 2px solid transparent;
            vertical-align: middle;
            transition: all 0.2s;
        }
        .child-punct:hover {
            background-color: #b2dfdb;
        }

        .active-child-target {
            background-color: #ffeb3b !important;
            border: 2px solid #f57f17 !important;
            color: #000000 !important;
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 10;
        }

        /* TEACHER MODE STYLES */
        #sentence-box.teacher-edit-active {
            border: 4px solid #9c27b0 !important;
            background-color: #f3e5f5 !important;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            justify-content: flex-start;
        }

        .controls-group {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            width: 100%;
        }

        button {
            font-family: inherit;
            font-size: clamp(13px, 1.5vw, 16px);
            padding: 8px 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 3px #777;
            white-space: nowrap;
        }
        
        button:active {
            transform: translateY(3px);
            box-shadow: 0 0px #777;
        }

        #listen-btn { background-color: #2e7d32; color: #ffffff; box-shadow: 0 3px #1b5e20; font-weight: bold; flex: 1; }
        #stop-btn { background-color: #c2185b; color: #ffffff; box-shadow: 0 3px #880e4f; font-weight: bold; flex: 1; }
        
        .punct-btn { 
            background-color: #1a237e; 
            color: #ffffff; 
            box-shadow: 0 3px #0d47a1; 
            font-size: 22px;
            font-weight: 900;
            padding: 6px 14px;
            flex: 1;
            border: 2px solid #000000;
        }
        
        .action-btn { background-color: #0277bd; color: #ffffff; box-shadow: 0 3px #01579b; flex: 1;}
        #print-btn { background-color: #00796b; color: #ffffff; box-shadow: 0 3px #004d40; font-weight: bold; flex: 1;}
        #undo-action-btn { background-color: #f57c00; color: #ffffff; box-shadow: 0 3px #e65100; font-weight: bold; flex: 1;}
        #delete-btn { background-color: #e53935; color: #ffffff; box-shadow: 0 3px #b71c1c; font-weight: bold; flex: 1;}
        #capitalize-btn { background-color: #43a047; color: #ffffff; box-shadow: 0 3px #1b5e20; font-weight: bold; flex: 1; display: none; }
        #hover-read-toggle-btn { background-color: #00acc1; color: #ffffff; box-shadow: 0 3px #00838f; font-weight: bold; flex: 1; }
        #clear-btn { background-color: #424242; color: #ffffff; box-shadow: 0 3px #212121; flex: 1;}
        #restore-btn { background-color: #00897b; color: #ffffff; box-shadow: 0 3px #004d40; font-weight: bold; display: none; flex: 1;}
        #read-sentence-btn { background-color: #6a1b9a; color: #ffffff; box-shadow: 0 3px #4a148c; flex: 1;}
        
        #options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
            flex-grow: 1;
            justify-content: space-evenly;
        }

        .option-btn {
            background-color: #6a1b9a;
            color: #ffffff;
            box-shadow: 0 4px #4a148c;
            font-size: clamp(22px, 3.2vw, 30px);
            padding: 12px;
            width: 100%;
            animation: popIn 0.3s ease-out;
            word-wrap: break-word;
            font-family: inherit;
        }

        #status {
            font-size: clamp(14px, 1.8vw, 17px);
            color: #222222;
            font-weight: bold;
            min-height: 24px;
            margin: 2px 0;
            transition: color 0.3s;
        }

        /* HIGH CONTRAST MODE STYLES */
        body.high-contrast {
            background-color: #121212;
            color: #ffffff;
        }
        body.high-contrast h1 { color: #ffeb3b; }
        body.high-contrast #status { color: #00e5ff; }
        body.high-contrast .edit-header { background: #000000; border-color: #ffeb3b; }
        body.high-contrast #sentence-box {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 4px solid #ffeb3b;
        }
        body.high-contrast #sentence-box.child-edit-active {
            background-color: #000000 !important;
            border: 4px solid #00e5ff !important;
        }
        body.high-contrast #sentence-box.teacher-edit-active {
            background-color: #000000 !important;
            border: 4px solid #ff5252 !important;
        }
        body.high-contrast .child-gap { background-color: #333; }
        body.high-contrast .child-gap:hover { background-color: #555; }
        body.high-contrast .child-word:hover { background-color: #333; border-color: #ffeb3b; }
        body.high-contrast .child-punct {
            color: #ffffff;
            background-color: #333;
        }
        body.high-contrast .child-punct:hover {
            background-color: #555;
        }
        body.high-contrast .active-child-target {
            background-color: #000000 !important;
            border: 2px solid #00e5ff !important;
            color: #00e5ff !important;
        }
        body.high-contrast button {
            border: 2px solid #ffffff;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 4px solid #d32f2f;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            animation: popIn 0.2s ease-out;
            color: black;
        }

        .modal-box h2 {
            margin-top: 0;
            color: #d32f2f;
            font-size: 26px;
        }
        
        .teacher-modal-box h2 { color: #9c27b0; }
        .teacher-modal-box { border-color: #9c27b0; }

        .modal-box p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        #confirm-clear-btn { background-color: #d32f2f; color: white; box-shadow: 0 3px #b71c1c; font-weight: bold; }
        #confirm-teacher-btn { background-color: #9c27b0; color: white; box-shadow: 0 3px #7b1fa2; font-weight: bold; }
        .cancel-btn { background-color: #757575; color: white; box-shadow: 0 3px #424242; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 650px) {
            .app-container { flex-direction: column; }
            .left-panel { height: 40%; }
            #options-container { flex-direction: row; }
            .option-btn { flex: 1; }
        }

        @media print {
            body { background-color: white !important; padding: 0 !important; margin: 0 !important; height: auto !important; overflow: visible !important; color: black !important; }
            h1, .right-panel, .edit-header, .modal-overlay, #status, #contrast-toggle-btn { display: none !important; }
            .app-container { display: block !important; max-width: 100% !important; height: auto !important; }
            .left-panel { width: 100% !important; height: auto !important; }
            #sentence-box {
                border: none !important; box-shadow: none !important; padding: 0 !important; font-size: 24pt !important; color: black !important; background: white !important;
                font-family: Arial, sans-serif !important; line-height: 1.6 !important; overflow: visible !important; white-space: pre-wrap !important;
            }
        }
    </style>
</head>
<body>

    <button id="contrast-toggle-btn" title="Toggle High Contrast">🌓</button>

    <h1>🎙️ Voice Choice Writer ✍️</h1>
    
    <div class="app-container">
        <!-- LEFT: Scrollable Sentence Box & Edit Bar -->
        <div class="left-panel">
            <div class="edit-header">
                <button id="edit-toggle-btn" class="mode-btn">✏️ Edit Mode: OFF</button>
                <button id="teacher-toggle-btn" class="mode-btn">👩‍🏫 Teacher Mode: OFF</button>
            </div>
            <div id="sentence-box" contenteditable="false"></div>
        </div>

        <!-- RIGHT: Controls and Choices -->
        <div class="right-panel">
            <div class="controls-group">
                <button id="listen-btn">🎤 Start Listening</button>
                <button id="stop-btn">🛑 Stop Listening</button>
            </div>

            <div class="controls-group">
                <button id="comma-btn" class="punct-btn">,</button>
                <button id="period-btn" class="punct-btn">.</button>
                <button id="question-btn" class="punct-btn">?</button>
                <button id="exclamation-btn" class="punct-btn">!</button>
                <button id="quote-btn" class="punct-btn">"</button>
            </div>

            <div class="controls-group">
                <button id="undo-action-btn">↺ Undo</button>
                <button id="delete-btn">⌫ Delete</button>
                <button id="capitalize-btn">🔠 Capitalize</button>
            </div>

            <div class="controls-group">
                <button id="read-sentence-btn">🔊 Read</button>
                <button id="hover-read-toggle-btn">🗣️ Hover Read: OFF</button>
                <button id="copy-btn" class="action-btn">📋 Copy</button>
                <button id="print-btn">🖨️ Print</button>
                <button id="clear-btn">🗑️ Clear</button>
                <button id="restore-btn">↩️ Restore</button>
            </div>

            <div id="status">Click "Start Listening" when ready!</div>
            
            <div id="options-container"></div>
        </div>
    </div>

    <!-- CLEAR CONFIRMATION MODAL -->
    <div id="clear-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>⚠️ Are you sure?</h2>
            <p>Do you really want to clear all your writing?</p>
            <div class="modal-buttons">
                <button id="confirm-clear-btn">Yes, Clear</button>
                <button class="cancel-btn" id="cancel-clear-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- TEACHER MODE ADULT CHECK MODAL -->
    <div id="teacher-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box teacher-modal-box">
            <h2>👩‍🏫 Teacher Mode</h2>
            <p><strong>Warning!</strong> This unlocks the keyboard.<br>Only adults should use this mode.</p>
            <div class="modal-buttons">
                <button id="confirm-teacher-btn">Yes, I am an adult</button>
                <button class="cancel-btn" id="cancel-teacher-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isAutoListening = false;
        let isListeningActive = false;
        
        let isEditMode = false; // Child Edit Mode
        let isTeacherMode = false;
        let isHighContrast = false;
        let isHoverReadOn = false; // New toggle for hover reading

        let restartTimer = null;
        let audioCtx = null;
        
        let phraseQueue = [];
        let backupText = ""; 
        let textHistory = []; // History for the Undo feature

        // --- NATURAL TTS VOICE SETUP --- //
        let bestVoice = null;
        function loadBestVoice() {
            let voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;
            // Look for high quality/natural sounding voices first
            bestVoice = voices.find(v => v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Google')) 
                     || voices.find(v => v.lang === 'en-GB' || v.lang === 'en-US') 
                     || voices[0];
        }
        // Voices load asynchronously in some browsers
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadBestVoice;
        }
        
        // Helper function for more natural speaking
        function speakTextNaturally(text, rate = 0.9) {
            if (!text) return;
            window.speechSynthesis.cancel(); // Stop anything currently playing
            let utterance = new SpeechSynthesisUtterance(text);
            if (bestVoice) utterance.voice = bestVoice;
            utterance.rate = rate; // Slightly slower for clarity
            utterance.pitch = 1.05; // Very slight pitch up for a friendlier tone
            window.speechSynthesis.speak(utterance);
        }

        const sentenceBox = document.getElementById('sentence-box');
        const statusText = document.getElementById('status');
        const optionsContainer = document.getElementById('options-container');
        
        const editToggleBtn = document.getElementById('edit-toggle-btn');
        const teacherToggleBtn = document.getElementById('teacher-toggle-btn');
        const contrastToggleBtn = document.getElementById('contrast-toggle-btn');
        const capitalizeBtn = document.getElementById('capitalize-btn');
        const hoverReadToggleBtn = document.getElementById('hover-read-toggle-btn');

        if (!SpeechRecognition) {
            statusText.innerText = "Oops! Your browser doesn't support voice typing. Try Google Chrome!";
        } else {
            recognition = new SpeechRecognition();
            recognition.maxAlternatives = 5; 
            recognition.continuous = false; 
            recognition.interimResults = false;
            recognition.lang = 'en-GB';

            const listenBtn = document.getElementById('listen-btn');
            const stopBtn = document.getElementById('stop-btn');

            function warmUpMicrophoneHardware() {
                try {
                    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                } catch (e) {}
            }

            // --- TEXT EXTRACTION HELPER --- //
            function getCurrentText() {
                let text = sentenceBox.textContent || "";
                return text.replace(/\s+/g, ' ').replace(/\s+([.,!?])/g, '$1').trim();
            }

            function updateSentenceText(newText) {
                if (isEditMode) {
                    renderChildSpans(newText);
                } else {
                    sentenceBox.textContent = newText;
                }
                localStorage.setItem('saved_voice_writer_text', newText);
            }

            // --- UNDO HISTORY HELPER --- //
            function saveStateToHistory() {
                textHistory.push(getCurrentText());
                if (textHistory.length > 30) { textHistory.shift(); }
            }

            // --- CHILD EDIT MODE SPANS LOGIC --- //
            function createGapSpan() {
                const gSpan = document.createElement('span');
                gSpan.className = 'child-gap';
                gSpan.textContent = ' '; 
                gSpan.onclick = () => setActiveTarget(gSpan);
                return gSpan;
            }

            function setActiveTarget(el) {
                document.querySelectorAll('.active-child-target').forEach(e => e.classList.remove('active-child-target'));
                el.classList.add('active-child-target');
            }

            // Renders words, gaps AND punctuation separately
            function renderChildSpans(text) {
                let cleanText = text.replace(/\s+/g, ' ').trim();
                const tokens = cleanText.match(/[a-zA-Z0-9'’]+|[.,!?"']/g) || [];
                
                sentenceBox.innerHTML = '';
                sentenceBox.appendChild(createGapSpan()); 
                
                tokens.forEach(token => {
                    const isPunct = /^[.,!?"']$/.test(token);
                    const span = document.createElement('span');
                    span.className = isPunct ? 'child-punct' : 'child-word';
                    span.innerText = token;
                    
                    span.onclick = () => setActiveTarget(span);
                    
                    // Add Hover to Read listener
                    if (!isPunct) {
                        span.addEventListener('mouseenter', () => {
                            if (isHoverReadOn && isEditMode) {
                                speakTextNaturally(token, 0.85); // Speak the individual word
                            }
                        });
                    }

                    sentenceBox.appendChild(span);
                    sentenceBox.appendChild(createGapSpan()); 
                });
            }

            // --- MODE TOGGLES --- //
            contrastToggleBtn.addEventListener('click', () => {
                isHighContrast = !isHighContrast;
                document.body.classList.toggle('high-contrast', isHighContrast);
            });

            hoverReadToggleBtn.addEventListener('click', () => {
                isHoverReadOn = !isHoverReadOn;
                if (isHoverReadOn) {
                    hoverReadToggleBtn.innerText = "🗣️ Hover Read: ON";
                    hoverReadToggleBtn.style.backgroundColor = "#ff9800";
                    hoverReadToggleBtn.style.color = "#000";
                    statusText.innerText = "Hover Read ON: Move your mouse over words in Edit Mode!";
                } else {
                    hoverReadToggleBtn.innerText = "🗣️ Hover Read: OFF";
                    hoverReadToggleBtn.style.backgroundColor = "#00acc1";
                    hoverReadToggleBtn.style.color = "#fff";
                    statusText.innerText = "Hover Read OFF.";
                }
            });

            function updateModes() {
                const currentExtractedText = getCurrentText();

                if (isTeacherMode) {
                    sentenceBox.innerHTML = ''; 
                    sentenceBox.textContent = currentExtractedText; 
                    
                    sentenceBox.contentEditable = "true";
                    sentenceBox.className = 'teacher-edit-active';
                    
                    teacherToggleBtn.innerText = "👩‍🏫 Teacher Mode: ON";
                    teacherToggleBtn.style.backgroundColor = "#9c27b0";
                    editToggleBtn.innerText = "✏️ Edit Mode: OFF";
                    editToggleBtn.style.backgroundColor = "#00796b";
                    
                    capitalizeBtn.style.display = 'none'; 
                    
                    statusText.innerText = "Teacher Mode ON: Keyboard unlocked.";
                    sentenceBox.focus();
                } else if (isEditMode) {
                    sentenceBox.contentEditable = "false"; 
                    sentenceBox.className = 'child-edit-active';
                    
                    renderChildSpans(currentExtractedText);
                    
                    editToggleBtn.innerText = "✏️ Edit Mode: ON";
                    editToggleBtn.style.backgroundColor = "#ff9800";
                    teacherToggleBtn.innerText = "👩‍🏫 Teacher Mode: OFF";
                    teacherToggleBtn.style.backgroundColor = "#00796b";
                    
                    capitalizeBtn.style.display = 'block'; 
                    
                    statusText.innerText = "Edit Mode ON: Tap a word, punctuation, or gap!";
                } else {
                    sentenceBox.innerHTML = ''; 
                    sentenceBox.textContent = currentExtractedText; 
                    
                    sentenceBox.contentEditable = "false";
                    sentenceBox.className = '';
                    
                    editToggleBtn.innerText = "✏️ Edit Mode: OFF";
                    editToggleBtn.style.backgroundColor = "#00796b";
                    teacherToggleBtn.innerText = "👩‍🏫 Teacher Mode: OFF";
                    teacherToggleBtn.style.backgroundColor = "#00796b";
                    
                    capitalizeBtn.style.display = 'none'; 
                    
                    statusText.innerText = "Standard Mode: Text will go at the end.";
                }
            }

            editToggleBtn.addEventListener('click', () => {
                isEditMode = !isEditMode;
                if (isEditMode) isTeacherMode = false; 
                updateModes();
            });

            // TEACHER MODAL LOGIC
            const teacherModal = document.getElementById('teacher-modal');
            teacherToggleBtn.addEventListener('click', () => {
                if (isTeacherMode) {
                    isTeacherMode = false;
                    updateModes();
                } else {
                    teacherModal.style.display = 'flex';
                }
            });

            document.getElementById('confirm-teacher-btn').addEventListener('click', () => {
                teacherModal.style.display = 'none';
                isTeacherMode = true;
                isEditMode = false; 
                updateModes();
            });

            document.getElementById('cancel-teacher-btn').addEventListener('click', () => {
                teacherModal.style.display = 'none';
            });

            sentenceBox.addEventListener('input', () => {
                if (isTeacherMode) {
                    localStorage.setItem('saved_voice_writer_text', getCurrentText());
                }
            });

            // --- LOCAL STORAGE INIT --- //
            const savedText = localStorage.getItem('saved_voice_writer_text');
            if (savedText) {
                updateSentenceText(savedText);
            }

            // --- RECOGNITION START/STOP --- //
            listenBtn.addEventListener('click', () => {
                warmUpMicrophoneHardware();
                if (!isListeningActive) {
                    startListeningCycle();
                }
            });

            stopBtn.addEventListener('click', () => {
                stopListeningCycle();
                statusText.innerText = "Stopped.";
            });

            function startListeningCycle() {
                isAutoListening = true;
                if (!isListeningActive) {
                    try { recognition.start(); } catch (e) { console.error(e); }
                }
            }

            function stopListeningCycle() {
                isAutoListening = false;
                clearTimeout(restartTimer);
                try { recognition.stop(); } catch (e) {}
            }

            recognition.onstart = () => {
                isListeningActive = true;
                statusText.innerText = "🎙️ Listening... speak now!";
                document.body.style.backgroundColor = isHighContrast ? "#1a0000" : "#ffebee";
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    statusText.innerText = "Didn't hear anything. Try again.";
                } else if (event.error !== 'aborted') {
                    statusText.innerText = "Microphone error: " + event.error;
                }
                isListeningActive = false;
                scheduleRestart();
            };

            recognition.onend = () => {
                isListeningActive = false;
                document.body.style.backgroundColor = isHighContrast ? "#121212" : "#e0f7fa";
                scheduleRestart();
            };

            function scheduleRestart() {
                if (isAutoListening) {
                    statusText.innerText = "Thinking...";
                    clearTimeout(restartTimer);
                    restartTimer = setTimeout(() => {
                        if (isAutoListening && !isListeningActive) {
                            try { recognition.start(); } catch (e) { }
                        }
                    }, 500); 
                } else {
                    document.body.style.backgroundColor = isHighContrast ? "#121212" : "#e0f7fa";
                }
            }

            // --- RESULT HANDLING --- //
            recognition.onresult = (event) => {
                let alternatives = event.results[0];
                let uniquePhrases = [];
                for (let i = 0; i < alternatives.length; i++) {
                    let text = alternatives[i].transcript.trim().toLowerCase();
                    let formatted = text.charAt(0).toUpperCase() + text.slice(1);
                    if (!uniquePhrases.includes(formatted)) {
                        uniquePhrases.push(formatted);
                    }
                }

                if (uniquePhrases.length > 0) {
                    phraseQueue.push(uniquePhrases);
                    if (phraseQueue.length === 1) {
                        displayOptions(phraseQueue[0]);
                    }
                    stopListeningCycle(); 
                }
            };

            function displayOptions(options) {
                optionsContainer.innerHTML = '';
                statusText.innerText = "Which one did you mean? Tap a purple button!";
                
                options.forEach(optionText => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = optionText;
                    btn.onclick = () => {
                        saveStateToHistory();
                        insertText(optionText);
                        optionsContainer.innerHTML = '';
                        statusText.innerText = "Great! Ready for more.";
                        
                        phraseQueue.shift();
                        if (phraseQueue.length > 0) {
                            displayOptions(phraseQueue[0]);
                        } else {
                            setTimeout(() => { startListeningCycle(); }, 600);
                        }
                    };
                    optionsContainer.appendChild(btn);
                });
            }

            function insertText(newWords) {
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl) {
                        if (activeEl.classList.contains('child-gap')) {
                            let wordsArr = newWords.split(' ');
                            let nextEl = activeEl.nextSibling;
                            wordsArr.forEach(w => {
                                let wSpan = document.createElement('span');
                                wSpan.className = 'child-word';
                                wSpan.innerText = w;
                                wSpan.onclick = () => setActiveTarget(wSpan);
                                wSpan.addEventListener('mouseenter', () => {
                                    if (isHoverReadOn && isEditMode) speakTextNaturally(w, 0.85);
                                });
                                
                                let newGap = createGapSpan();
                                sentenceBox.insertBefore(wSpan, nextEl);
                                sentenceBox.insertBefore(newGap, nextEl);
                            });
                            activeEl.classList.remove('active-child-target');
                        } else if (activeEl.classList.contains('child-word') || activeEl.classList.contains('child-punct')) {
                            activeEl.className = 'child-word';
                            activeEl.innerText = newWords;
                            activeEl.classList.remove('active-child-target');
                            
                            // Ensure the event listener exists if changing from punct back to word
                            activeEl.addEventListener('mouseenter', () => {
                                if (isHoverReadOn && isEditMode) speakTextNaturally(newWords, 0.85);
                            });
                        }
                        renderChildSpans(getCurrentText());
                        return;
                    }
                } else if (isTeacherMode) {
                    sentenceBox.focus();
                    let selection = window.getSelection();
                    if (selection.rangeCount > 0 && sentenceBox.contains(selection.anchorNode)) {
                        let range = selection.getRangeAt(0);
                        range.deleteContents();
                        let textNode = document.createTextNode(" " + newWords);
                        range.insertNode(textNode);
                        range.setStartAfter(textNode);
                        range.setEndAfter(textNode);
                        selection.removeAllRanges();
                        selection.addRange(range);
                        localStorage.setItem('saved_voice_writer_text', getCurrentText());
                        return;
                    }
                }
                
                let currentText = getCurrentText();
                if (currentText.length > 0 && !currentText.endsWith(' ')) { currentText += " "; }
                currentText += newWords;
                updateSentenceText(currentText);
            }

            function addPunctuation(mark) {
                saveStateToHistory();
                
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl) {
                        if (activeEl.classList.contains('child-punct')) {
                            activeEl.innerText = mark;
                            activeEl.classList.remove('active-child-target');
                            renderChildSpans(getCurrentText());
                            return;
                        } else if (activeEl.classList.contains('child-word')) {
                            let pSpan = document.createElement('span');
                            pSpan.className = 'child-punct';
                            pSpan.innerText = mark;
                            pSpan.onclick = () => setActiveTarget(pSpan);
                            
                            let nextGap = activeEl.nextSibling;
                            sentenceBox.insertBefore(pSpan, nextGap);
                            activeEl.classList.remove('active-child-target');
                            renderChildSpans(getCurrentText());
                            return;
                        } else if (activeEl.classList.contains('child-gap')) {
                            let pSpan = document.createElement('span');
                            pSpan.className = 'child-punct';
                            pSpan.innerText = mark;
                            pSpan.onclick = () => setActiveTarget(pSpan);
                            
                            sentenceBox.insertBefore(pSpan, activeEl);
                            activeEl.classList.remove('active-child-target');
                            renderChildSpans(getCurrentText());
                            return;
                        }
                    }
                } else if (isTeacherMode) {
                    sentenceBox.focus();
                    let selection = window.getSelection();
                    if (selection.rangeCount > 0 && sentenceBox.contains(selection.anchorNode)) {
                        let range = selection.getRangeAt(0);
                        range.deleteContents();
                        let textNode = document.createTextNode(mark);
                        range.insertNode(textNode);
                        range.setStartAfter(textNode);
                        range.setEndAfter(textNode);
                        selection.removeAllRanges();
                        selection.addRange(range);
                        localStorage.setItem('saved_voice_writer_text', getCurrentText());
                        return;
                    }
                }

                let currentText = getCurrentText();
                currentText = currentText.trimEnd() + mark;
                updateSentenceText(currentText);
            }

            // Bind Punctuation Buttons
            document.getElementById('comma-btn').addEventListener('click', () => addPunctuation(','));
            document.getElementById('period-btn').addEventListener('click', () => addPunctuation('.'));
            document.getElementById('question-btn').addEventListener('click', () => addPunctuation('?'));
            document.getElementById('exclamation-btn').addEventListener('click', () => addPunctuation('!'));
            document.getElementById('quote-btn').addEventListener('click', () => addPunctuation('"'));

            // Undo Action
            document.getElementById('undo-action-btn').addEventListener('click', () => {
                if (textHistory.length > 0) {
                    const previousText = textHistory.pop();
                    updateSentenceText(previousText);
                    statusText.innerText = "Undo successful.";
                } else {
                    statusText.innerText = "Nothing to undo.";
                }
            });

            // Delete Action
            document.getElementById('delete-btn').addEventListener('click', () => {
                saveStateToHistory();
                
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl) {
                        if (activeEl.classList.contains('child-word') || activeEl.classList.contains('child-punct')) {
                            let nextGap = activeEl.nextElementSibling;
                            if (nextGap && nextGap.classList.contains('child-gap')) {
                                sentenceBox.removeChild(nextGap);
                            }
                            sentenceBox.removeChild(activeEl);
                            renderChildSpans(getCurrentText());
                            statusText.innerText = "Deleted selection!";
                            return;
                        }
                    }
                }

                let currentText = getCurrentText();
                if (currentText.length > 0) {
                    let lastSpace = currentText.lastIndexOf(' ');
                    if (lastSpace > -1) {
                        currentText = currentText.substring(0, lastSpace).trim();
                    } else {
                        currentText = ""; 
                    }
                    updateSentenceText(currentText);
                    statusText.innerText = "Deleted last word.";
                }
            });

            // Capitalize Action
            capitalizeBtn.addEventListener('click', () => {
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl && activeEl.classList.contains('child-word')) {
                        saveStateToHistory();
                        let text = activeEl.innerText;
                        let firstChar = text.charAt(0);
                        
                        if (firstChar === firstChar.toUpperCase() && firstChar !== firstChar.toLowerCase()) {
                            activeEl.innerText = firstChar.toLowerCase() + text.slice(1);
                        } else {
                            activeEl.innerText = firstChar.toUpperCase() + text.slice(1);
                        }
                        renderChildSpans(getCurrentText());
                    } else {
                        statusText.innerText = "Tap a word (yellow border) to change its capitalization!";
                    }
                }
            });

            // --- READ ALOUD (Whole Sentence) --- //
            document.getElementById('read-sentence-btn').addEventListener('click', () => {
                let currentText = getCurrentText();
                if (currentText === "") {
                    statusText.innerText = "Nothing to read yet!";
                    return;
                }
                stopListeningCycle(); 
                statusText.innerText = "🔊 Reading...";
                loadBestVoice(); // Ensure we have the best voice right before speaking
                speakTextNaturally(currentText, 0.85); 
            });

            // --- COPY, PRINT, CLEAR, RESTORE --- //
            document.getElementById('copy-btn').addEventListener('click', () => {
                let currentText = getCurrentText();
                navigator.clipboard.writeText(currentText).then(() => {
                    statusText.innerText = "Copied to clipboard!";
                }).catch(err => {
                    statusText.innerText = "Couldn't copy text.";
                });
            });

            document.getElementById('print-btn').addEventListener('click', () => {
                window.print();
            });

            const clearModal = document.getElementById('clear-modal');
            const restoreBtn = document.getElementById('restore-btn');

            document.getElementById('clear-btn').addEventListener('click', () => { clearModal.style.display = 'flex'; });
            document.getElementById('cancel-clear-btn').addEventListener('click', () => { clearModal.style.display = 'none'; });

            document.getElementById('confirm-clear-btn').addEventListener('click', () => {
                let currentText = getCurrentText();
                if (currentText.trim() !== "") {
                    backupText = currentText; 
                    restoreBtn.style.display = 'inline-block'; 
                }
                
                updateSentenceText("");
                textHistory = []; 
                optionsContainer.innerHTML = '';
                phraseQueue = [];
                statusText.innerText = "Text cleared. Ready for a new story!";
                clearModal.style.display = 'none';
            });

            restoreBtn.addEventListener('click', () => {
                if (backupText !== "") {
                    saveStateToHistory();
                    updateSentenceText(backupText);
                    statusText.innerText = "Text restored!";
                    restoreBtn.style.display = 'none'; 
                    backupText = ""; 
                }
            });
            
            // Load voice pool on startup
            loadBestVoice();
        }
    </script>
</body>
</html>
