<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Choice Writer</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 12px;
            margin: 0;
            color: #222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        h1 { 
            color: #00796b; 
            margin: 0 0 8px 0;
            font-size: clamp(20px, 3vw, 26px);
            flex-shrink: 0;
        }

        /* Two-Column App Layout */
        .app-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            flex-grow: 1;
            height: calc(100% - 40px);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        /* Left Column: Scrollable Text Box */
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #sentence-box {
            background: white;
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            height: 100%;
            padding: 18px;
            font-size: clamp(22px, 3.2vw, 30px);
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Right Column: Controls and Options */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            justify-content: flex-start;
        }

        /* Compact single row control groups */
        .controls-group {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            gap: 6px;
            width: 100%;
        }

        button {
            font-family: inherit;
            font-size: clamp(14px, 1.6vw, 17px);
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 3px #777;
            white-space: nowrap;
        }
        
        button:active {
            transform: translateY(3px);
            box-shadow: 0 0px #777;
        }

        #listen-btn { background-color: #2e7d32; color: #ffffff; box-shadow: 0 3px #1b5e20; font-weight: bold; flex: 1; }
        #stop-btn { background-color: #c2185b; color: #ffffff; box-shadow: 0 3px #880e4f; font-weight: bold; flex: 1; }
        
        /* High-Contrast Dyslexia-Friendly Punctuation Styling */
        .punct-btn { 
            background-color: #1a237e; 
            color: #ffffff; 
            box-shadow: 0 3px #0d47a1; 
            font-size: 22px;
            font-weight: 900;
            padding: 6px 16px;
            flex: 1;
            border: 2px solid #000000;
        }
        
        .action-btn { background-color: #0277bd; color: #ffffff; box-shadow: 0 3px #01579b; }
        #undo-btn { background-color: #e65100; color: #ffffff; box-shadow: 0 3px #bf360c; font-weight: bold; }
        #clear-btn { background-color: #d32f2f; color: #ffffff; box-shadow: 0 3px #b71c1c; }
        #restore-btn { background-color: #00897b; color: #ffffff; box-shadow: 0 3px #004d40; font-weight: bold; display: none; }
        #read-sentence-btn { background-color: #6a1b9a; color: #ffffff; box-shadow: 0 3px #4a148c; }
        
        #options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
            flex-grow: 1;
            justify-content: space-evenly;
        }

        .option-btn {
            background-color: #6a1b9a;
            color: #ffffff;
            box-shadow: 0 4px #4a148c;
            font-size: clamp(22px, 3.2vw, 30px);
            padding: 12px;
            width: 100%;
            animation: popIn 0.3s ease-out;
            word-wrap: break-word;
        }

        #status {
            font-size: clamp(14px, 1.8vw, 17px);
            color: #222222;
            font-weight: bold;
            min-height: 24px;
            margin: 2px 0;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 4px solid #d32f2f;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            animation: popIn 0.2s ease-out;
        }

        .modal-box h2 {
            margin-top: 0;
            color: #d32f2f;
            font-size: 26px;
        }

        .modal-box p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        #confirm-clear-btn { background-color: #d32f2f; color: white; box-shadow: 0 3px #b71c1c; font-weight: bold; }
        #cancel-clear-btn { background-color: #757575; color: white; box-shadow: 0 3px #424242; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 650px) {
            .app-container { flex-direction: column; }
            .left-panel { height: 40%; }
            #options-container { flex-direction: row; }
            .option-btn { flex: 1; }
        }
    </style>
</head>
<body>

    <h1>🎙️ Voice Choice Writer ✍️</h1>
    
    <div class="app-container">
        <!-- LEFT: Scrollable Sentence Box -->
        <div class="left-panel">
            <div id="sentence-box"></div>
        </div>

        <!-- RIGHT: Controls and Choices -->
        <div class="right-panel">
            <!-- Listening Controls -->
            <div class="controls-group">
                <button id="listen-btn">🎤 Start Listening</button>
                <button id="stop-btn">🛑 Stop Listening</button>
            </div>

            <!-- High Contrast Punctuation Buttons -->
            <div class="controls-group">
                <button id="comma-btn" class="punct-btn">,</button>
                <button id="period-btn" class="punct-btn">.</button>
                <button id="question-btn" class="punct-btn">?</button>
                <button id="exclamation-btn" class="punct-btn">!</button>
            </div>

            <!-- Action Controls Compact Row -->
            <div class="controls-group">
                <button id="read-sentence-btn">🔊 Read</button>
                <button id="undo-btn">⌫ Delete</button>
                <button id="copy-btn" class="action-btn">📋 Copy</button>
                <button id="clear-btn">🗑️ Clear</button>
                <button id="restore-btn">↩️ Restore</button>
            </div>

            <div id="status">Click "Start Listening" when ready!</div>
            
            <!-- Word Choices Output -->
            <div id="options-container"></div>
        </div>
    </div>

    <!-- Confirmation Modal Dialog -->
    <div id="clear-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>⚠️ Are you sure?</h2>
            <p>Do you really want to clear all your writing?</p>
            <div class="modal-buttons">
                <button id="confirm-clear-btn">Yes, Clear</button>
                <button id="cancel-clear-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isAutoListening = false;
        let isListeningActive = false;
        let restartTimer = null;
        
        let phraseQueue = [];
        let backupText = ""; 

        if (!SpeechRecognition) {
            document.getElementById('status').innerText = "Oops! Your browser doesn't support voice typing. Try Google Chrome!";
        } else {
            recognition = new SpeechRecognition();
            recognition.maxAlternatives = 3; 
            recognition.continuous = false; 
            recognition.interimResults = false;
            recognition.lang = 'en-GB';

            const listenBtn = document.getElementById('listen-btn');
            const stopBtn = document.getElementById('stop-btn');
            const commaBtn = document.getElementById('comma-btn');
            const periodBtn = document.getElementById('period-btn');
            const questionBtn = document.getElementById('question-btn');
            const exclamationBtn = document.getElementById('exclamation-btn');
            const copyBtn = document.getElementById('copy-btn');
            const undoBtn = document.getElementById('undo-btn');
            const clearBtn = document.getElementById('clear-btn');
            const restoreBtn = document.getElementById('restore-btn');
            const readSentenceBtn = document.getElementById('read-sentence-btn');
            const sentenceBox = document.getElementById('sentence-box');
            const optionsContainer = document.getElementById('options-container');
            const statusText = document.getElementById('status');
            
            const clearModal = document.getElementById('clear-modal');
            const confirmClearBtn = document.getElementById('confirm-clear-btn');
            const cancelClearBtn = document.getElementById('cancel-clear-btn');

            // --- LOCAL STORAGE SYSTEM (PERSISTENCE) --- //
            function updateSentenceText(newText) {
                sentenceBox.textContent = newText;
                localStorage.setItem('saved_voice_writer_text', newText);
            }

            // Restore automatically when page reloads or opens!
            window.addEventListener('load', () => {
                const saved = localStorage.getItem('saved_voice_writer_text');
                if (saved && saved.trim().length > 0) {
                    sentenceBox.textContent = saved;
                    statusText.innerText = "Restored your previous work!";
                }
            });

            // --- PHONETIC & SPELLING APPROXIMATION GENERATOR --- //
            // Generates realistic alternatives for speech difficulties when browser yields < 3 guesses
            function generateApproximations(baseWord) {
                const phonetics = {
                    'th': ['f', 'v', 's', 'd'],
                    'r': ['w', 'l'],
                    'l': ['w', 'y'],
                    's': ['z', 'th', 'sh'],
                    'c': ['k', 's'],
                    'k': ['g', 'c'],
                    'p': ['b'],
                    't': ['d']
                };

                let choices = new Set([baseWord]);

                // Try common phonetic replacements
                for (let key in phonetics) {
                    if (baseWord.includes(key)) {
                        phonetics[key].forEach(rep => {
                            if (choices.size < 3) choices.add(baseWord.replace(key, rep));
                        });
                    }
                }

                // If still under 3, generate spelling variations
                if (choices.size < 3 && baseWord.length > 3) {
                    choices.add(baseWord.slice(0, -1)); // Drop last letter
                }
                if (choices.size < 3) {
                    choices.add(baseWord + "e"); // Add silent e
                }

                // Fallbacks if word is very short
                const simpleFallbacks = ['a', 'the', 'is', 'it', 'to', 'in', 'and'];
                let fallbackIdx = 0;
                while (choices.size < 3 && fallbackIdx < simpleFallbacks.length) {
                    if (simpleFallbacks[fallbackIdx] !== baseWord) {
                        choices.add(simpleFallbacks[fallbackIdx]);
                    }
                    fallbackIdx++;
                }

                return Array.from(choices).slice(0, 3);
            }

            function safeStartListen() {
                if (!isAutoListening) return;
                clearTimeout(restartTimer);

                if (phraseQueue.length > 0) {
                    processNextWordInQueue();
                    return;
                }

                if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                    statusText.innerText = "Waiting for audio to finish...";
                    restartTimer = setTimeout(safeStartListen, 300);
                    return;
                }

                if (isListeningActive) return;

                try {
                    recognition.start();
                } catch (e) {
                    restartTimer = setTimeout(safeStartListen, 300);
                }
            }

            function stopAllListening() {
                isAutoListening = false;
                isListeningActive = false;
                phraseQueue = [];
                clearTimeout(restartTimer);
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                try {
                    recognition.stop();
                } catch (e) {}
                stopListeningUI();
            }

            function stopListeningUI() {
                listenBtn.style.backgroundColor = "#2e7d32";
                listenBtn.style.color = "#ffffff";
                listenBtn.innerText = "🎤 Start Listening";
            }

            function updateListeningUI() {
                listenBtn.style.backgroundColor = "#fbc02d"; 
                listenBtn.style.color = "#000000";
                listenBtn.innerText = "🔴 Listening Active";
            }

            function addPunctuation(mark) {
                let text = sentenceBox.textContent;
                if (text.endsWith(' ')) {
                    text = text.slice(0, -1);
                }
                updateSentenceText(text + mark + ' ');
                sentenceBox.scrollTop = sentenceBox.scrollHeight;
            }

            function speakText(text, callback) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.85; 
                    if (callback) {
                        utterance.onend = callback;
                        utterance.onerror = callback;
                    }
                    window.speechSynthesis.speak(utterance);
                } else if (callback) {
                    callback();
                }
            }

            function processNextWordInQueue() {
                if (phraseQueue.length === 0) {
                    if (isAutoListening) {
                        statusText.innerText = "Phrase finished! Mic starting...";
                        restartTimer = setTimeout(safeStartListen, 400);
                    }
                    return;
                }

                const wordOptions = phraseQueue.shift();
                optionsContainer.innerHTML = ''; 
                statusText.innerText = `Pick word (${phraseQueue.length + 1} remaining): 👇`;

                wordOptions.forEach(word => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = word;
                    
                    btn.onmouseenter = () => {
                        if (!isListeningActive) speakText(word);
                    };

                    btn.onclick = () => {
                        let formattedWord = word;
                        const currentText = sentenceBox.textContent;
                        if (currentText.length === 0 || /[.!?]\s*$/.test(currentText)) {
                            formattedWord = formattedWord.charAt(0).toUpperCase() + formattedWord.slice(1);
                        }
                        
                        updateSentenceText(sentenceBox.textContent + formattedWord + ' ');
                        sentenceBox.scrollTop = sentenceBox.scrollHeight;
                        optionsContainer.innerHTML = '';
                        
                        setTimeout(processNextWordInQueue, 250);
                    };

                    optionsContainer.appendChild(btn);
                });
            }

            // --- BUTTON HANDLERS --- //

            listenBtn.addEventListener('click', () => {
                optionsContainer.innerHTML = '';
                phraseQueue = [];
                isAutoListening = true;
                safeStartListen();
            });

            stopBtn.addEventListener('click', () => {
                stopAllListening();
                statusText.innerText = "Listening stopped. Click Start when ready.";
                optionsContainer.innerHTML = '';
            });

            commaBtn.addEventListener('click', () => {
                addPunctuation(',');
                if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300);
            });

            periodBtn.addEventListener('click', () => {
                addPunctuation('.');
                if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300);
            });

            questionBtn.addEventListener('click', () => {
                addPunctuation('?');
                if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300);
            });

            exclamationBtn.addEventListener('click', () => {
                addPunctuation('!');
                if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300);
            });

            undoBtn.addEventListener('click', () => {
                let text = sentenceBox.textContent.trimEnd();
                if (text) {
                    let words = text.split(/\s+/);
                    words.pop();
                    updateSentenceText(words.length > 0 ? words.join(' ') + ' ' : '');
                    statusText.innerText = "Last word removed.";
                }
            });

            copyBtn.addEventListener('click', () => {
                const text = sentenceBox.textContent.trim();
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        const originalText = copyBtn.innerText;
                        copyBtn.innerText = "✅ Copied!";
                        setTimeout(() => copyBtn.innerText = originalText, 2500);
                    });
                }
            });

            clearBtn.addEventListener('click', () => {
                if (sentenceBox.textContent.trim().length > 0) {
                    clearModal.style.display = 'flex';
                }
            });

            confirmClearBtn.addEventListener('click', () => {
                backupText = sentenceBox.textContent;
                updateSentenceText('');
                optionsContainer.innerHTML = '';
                stopAllListening();
                clearModal.style.display = 'none';
                restoreBtn.style.display = 'inline-block';
                statusText.innerText = "Cleared. Use 'Restore' if this was a mistake.";
            });

            cancelClearBtn.addEventListener('click', () => {
                clearModal.style.display = 'none';
            });

            restoreBtn.addEventListener('click', () => {
                if (backupText) {
                    updateSentenceText(backupText);
                    restoreBtn.style.display = 'none';
                    statusText.innerText = "Text restored!";
                }
            });

            readSentenceBtn.addEventListener('click', () => {
                const text = sentenceBox.textContent.trim();
                if (text) {
                    const wasAuto = isAutoListening;
                    isAutoListening = false;
                    try { recognition.stop(); } catch(e){}
                    
                    speakText(text, () => {
                        if (wasAuto) {
                            isAutoListening = true;
                            safeStartListen();
                        }
                    });
                }
            });

            // --- RECOGNITION EVENTS --- //

            recognition.onstart = () => {
                isListeningActive = true;
                updateListeningUI();
                statusText.innerText = "🔴 Listening... Speak now! 👂";
            };

            recognition.onresult = (event) => {
                const results = event.results[0];
                optionsContainer.innerHTML = ''; 
                phraseQueue = [];

                let wordsByPosition = [];

                for (let i = 0; i < results.length; i++) {
                    let transcript = results[i].transcript.trim().toLowerCase();
                    transcript = transcript.replace(/[.,!?]/g, ''); 
                    let words = transcript.split(/\s+/).filter(w => w.length > 0);

                    words.forEach((w, pos) => {
                        if (!wordsByPosition[pos]) {
                            wordsByPosition[pos] = new Set();
                        }
                        wordsByPosition[pos].add(w);
                    });
                }

                // Ensure EVERY word position has exactly 3 options (using approximation generator if needed)
                phraseQueue = wordsByPosition.map(set => {
                    let choices = Array.from(set);
                    if (choices.length < 3) {
                        choices = generateApproximations(choices[0]);
                    }
                    return choices.slice(0, 3);
                }).filter(arr => arr.length > 0);

                if (phraseQueue.length > 0) {
                    processNextWordInQueue();
                } else {
                    statusText.innerText = "Didn't catch that. Trying again...";
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 600);
                    }
                }
            };

            recognition.onerror = (event) => {
                isListeningActive = false;
                if (event.error === 'no-speech') {
                    statusText.innerText = "No speech detected. Listening again...";
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 400);
                    }
                } else if (event.error === 'aborted') {
                    // Intentionally stopped
                } else {
                    statusText.innerText = "Mic status: " + event.error;
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 800);
                    }
                }
            };

            recognition.onend = () => {
                isListeningActive = false;
                if (phraseQueue.length > 0) {
                    processNextWordInQueue();
                } else if (isAutoListening) {
                    restartTimer = setTimeout(safeStartListen, 300);
                } else {
                    stopListeningUI();
                }
            };
        }
    </script>
</body>
</html>
