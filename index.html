<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClearWrite Access</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Playpen+Sans:wght@400;600&family=Playwrite+GB+S:wght@100..400&display=swap');

        :root {
            --box-bg: #ffffff;
            --main-font: 'Lexend', Verdana, sans-serif;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: var(--main-font);
            background-color: #e0f7fa;
            text-align: center;
            padding: 12px;
            margin: 0;
            color: #222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        h1 { 
            color: #00796b; 
            margin: 0 0 8px 0;
            font-size: clamp(20px, 3vw, 26px);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        #teacher-settings-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 3px #e65100;
        }

        .app-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            flex-grow: 1;
            height: calc(100% - 40px);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
            position: relative;
        }

        .edit-header {
            display: flex;
            justify-content: center;
            gap: 6px;
            align-items: center;
            background: #b2dfdb;
            padding: 6px;
            border-radius: 10px;
            border: 2px solid #00796b;
            flex-wrap: wrap;
        }

        .color-tint-bar {
            display: none; 
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: #e0f2f1;
            padding: 6px 12px;
            border-radius: 10px;
            border: 2px solid #00796b;
            flex-wrap: wrap;
        }

        .swatch-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #888; cursor: pointer; box-shadow: 0 2px #666; }

        .mode-btn, select.mode-btn {
            background-color: #00796b;
            color: white;
            font-weight: bold;
            box-shadow: 0 3px #004d40;
            padding: 4px 8px;
            font-size: clamp(12px, 1.2vw, 14px);
            flex: 1;
            min-width: 80px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
        }

        select.mode-btn { appearance: none; text-align: center; cursor: pointer; }
        select.mode-btn option { background-color: white; color: black; }

        #fix-it-badge {
            position: absolute;
            top: 50px;
            right: 10px;
            background: #ffeb3b;
            border: 2px solid #fbc02d;
            border-radius: 20px;
            padding: 5px 12px;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: none;
        }

        #sentence-box {
            background-color: var(--box-bg) !important;
            font-family: var(--main-font);
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            flex-grow: 1;
            padding: 18px;
            font-size: clamp(22px, 3.2vw, 30px);
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            outline: none;
            transition: all 0.3s ease;
        }

        #sentence-box.keyboard-active { border: 4px solid #f44336 !important; }
        #sentence-box.child-edit-active { border: 4px solid #ff9800 !important; white-space: normal; }

        .child-gap { display: inline; transition: background 0.2s; }
        .child-word { display: inline-block; border-radius: 4px; transition: all 0.2s; }
        .child-punct { display: inline-block; font-weight: 900; }

        .speaking-highlight { background-color: #ffff00 !important; color: #000 !important; border-radius: 5px; box-shadow: 0 0 5px #ffeb3b; }

        #sentence-box.features-on:not(.child-edit-active) .child-word:hover { background-color: rgba(0, 188, 212, 0.15); cursor: pointer; }
        
        #sentence-box.child-edit-active .child-gap { display: inline-block; width: 20px; height: 28px; margin: 0 2px; background-color: rgba(0, 0, 0, 0.05); border-radius: 4px; cursor: pointer; vertical-align: middle; }
        #sentence-box.child-edit-active .child-word { padding: 2px 6px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        #sentence-box.child-edit-active .child-word:hover { background-color: rgba(255, 235, 59, 0.6); }

        #sentence-box.child-edit-active .child-word.capital-error { background-color: #fce4ec; border-color: #f48fb1; color: #000; }
        #sentence-box.child-edit-active .child-word.grammar-error { background-color: #f3e5f5; border-color: #ba68c8; text-decoration: underline wavy #7b1fa2; color: #000; }

        #sentence-box.child-edit-active .child-punct { padding: 2px 6px; margin: 0 1px; border-radius: 4px; cursor: pointer; background-color: rgba(0, 0, 0, 0.05); }

        .active-child-target { background-color: #ffeb3b !important; border: 2px solid #f57f17 !important; color: #000000 !important; transform: scale(1.1); }

        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; height: 100%; }

        .controls-group { display: flex; justify-content: center; gap: 5px; width: 100%; flex-wrap: wrap; }
        button { font-family: inherit; font-size: clamp(13px, 1.5vw, 16px); padding: 8px 10px; border-radius: 10px; border: none; cursor: pointer; box-shadow: 0 3px #777; white-space: nowrap; }
        button:active { transform: translateY(3px); box-shadow: 0 0px #777; }

        #listen-btn { background-color: #2e7d32; color: #ffffff; box-shadow: 0 3px #1b5e20; font-weight: bold; flex: 1; }
        #stop-btn { background-color: #c2185b; color: #ffffff; box-shadow: 0 3px #880e4f; font-weight: bold; flex: 1; }
        .punct-btn { background-color: #1a237e; color: #ffffff; box-shadow: 0 3px #0d47a1; font-size: 22px; font-weight: 900; padding: 6px 14px; flex: 1; border: 2px solid #000000; }
        
        #hover-read-toggle-btn { background-color: #00acc1; color: #ffffff; box-shadow: 0 3px #00838f; font-weight: bold; flex: 1; }
        #picture-hover-toggle-btn { background-color: #e91e63; color: #ffffff; box-shadow: 0 3px #c2185b; font-weight: bold; flex: 1; }
        #read-sentence-btn { background-color: #6a1b9a; color: #ffffff; box-shadow: 0 3px #4a148c; flex: 1;}

        #options-container, #custom-words-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; justify-content: center; }
        .topic-word-btn { background-color: #00897b; color: white; border-radius: 20px; font-size: 18px; padding: 6px 14px; box-shadow: 0 3px #004d40; }

        #status { font-size: clamp(14px, 1.8vw, 17px); font-weight: bold; min-height: 24px; margin: 2px 0; }

        /* MODALS & TOOLTIPS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; padding: 25px; border-radius: 20px; max-width: 500px; width: 90%; box-shadow: 0 8px 16px rgba(0,0,0,0.3); text-align: left; }
        .modal-box h2 { margin-top: 0; color: #00796b; text-align: center; }
        .modal-box label { display: block; margin: 10px 0; font-size: 18px; cursor: pointer; }
        .modal-box textarea, .modal-box input[type="text"] { width: 100%; padding: 8px; font-family: inherit; font-size: 16px; border-radius: 8px; border: 2px solid #ccc; }
        .modal-buttons { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }

        #picture-tooltip { position: fixed; display: none; background: white; border: 3px solid #e91e63; border-radius: 12px; padding: 10px; box-shadow: 0 6px 16px rgba(0,0,0,0.25); font-size: 60px; z-index: 9999; pointer-events: none; transform: translate(-50%, -110%); }
        #grammar-tooltip { position: fixed; display: none; background: #fff8e1; border: 4px solid #ff9800; border-radius: 16px; padding: 14px 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); font-size: 20px; font-weight: 600; color: #222222; z-index: 9999; pointer-events: none; max-width: 320px; text-align: center; transform: translate(-50%, -120%); }

        /* PRINT STYLES - Hides everything except the sentence box text */
        @media print {
            body { background: white !important; }
            body * { visibility: hidden; }
            #sentence-box, #sentence-box * { visibility: visible; }
            #sentence-box { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                border: none !important; 
                box-shadow: none !important; 
                background: white !important;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <h1>🎙️ ClearWrite Access ✍️ <button id="teacher-settings-btn" title="Teacher Settings">⚙️</button></h1>
    
    <div class="app-container">
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="edit-header">
                <select id="font-select" class="mode-btn" style="background-color: #673ab7;">
                    <option value="0">🔤 Lexend</option>
                    <option value="1">🔤 Playpen</option>
                    <option value="2">🔤 Playwrite</option>
                    <option value="3">🔤 Comic Sans</option>
                </select>
                <button id="tint-toggle-btn" class="mode-btn" style="background-color: #0288d1;">🎨 Color</button>
                <button id="syllable-toggle-btn" class="mode-btn" style="background-color: #009688;">✂️ Syl: OFF</button>
                <button id="teacher-mode-toggle-btn" class="mode-btn" style="background-color: #f44336;">👩‍🏫 Teacher: OFF</button>
                <button id="edit-toggle-btn" class="mode-btn">✏️ Edit: OFF</button>
            </div>
            
            <div class="color-tint-bar" id="color-tint-bar">
                <button class="swatch-btn" data-color="#ffffff" style="background-color: #ffffff;"></button>
                <button class="swatch-btn" data-color="#E6F2A2" style="background-color: #E6F2A2;"></button>
                <button class="swatch-btn" data-color="#FFD6E5" style="background-color: #FFD6E5;"></button>
                <button class="swatch-btn" data-color="#FFE0B2" style="background-color: #FFE0B2;"></button>
                <button class="swatch-btn" data-color="#C8E6C9" style="background-color: #C8E6C9;"></button>
                <button class="swatch-btn" data-color="#B3E5FC" style="background-color: #B3E5FC;"></button>
                <button class="swatch-btn" data-color="#FFF9C4" style="background-color: #FFF9C4;"></button>
            </div>

            <div id="fix-it-badge">🎯 0 fixes needed!</div>
            <div id="sentence-box" contenteditable="false"></div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="controls-group">
                <button id="listen-btn">🎤 Listen</button>
                <button id="stop-btn">🛑 Stop</button>
            </div>
            <div class="controls-group">
                <button id="comma-btn" class="punct-btn">,</button>
                <button id="period-btn" class="punct-btn">.</button>
                <button id="question-btn" class="punct-btn">?</button>
                <button id="exclamation-btn" class="punct-btn">!</button>
                <button id="quote-btn" class="punct-btn">"</button>
            </div>
            <div class="controls-group">
                <button id="undo-action-btn" style="background-color: #f57c00; color: white; flex: 1;">↺ Undo</button>
                <button id="delete-btn" style="background-color: #e53935; color: white; flex: 1;">⌫ Delete</button>
                <button id="copy-btn" style="background-color: #00897b; color: white; flex: 1;">📋 Copy</button>
                <button id="print-btn" style="background-color: #3949ab; color: white; flex: 1;">🖨️ Print</button>
            </div>
            <div class="controls-group">
                <button id="read-sentence-btn">🔊 Read</button>
                <button id="hover-read-toggle-btn">🗣️ Hover: OFF</button>
                <button id="picture-hover-toggle-btn">🖼️ Pics: OFF</button>
            </div>
            
            <div id="status">Click "Listen" when ready!</div>
            <div id="custom-words-container"></div>
            <div id="options-container"></div>
        </div>
    </div>

    <!-- TOOLTIPS & MODALS -->
    <div id="picture-tooltip"></div>
    <div id="grammar-tooltip"></div>

    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>⚙️ Teacher Settings</h2>
            <hr>
            <label><input type="checkbox" id="rule-caps" checked> Check Capital Letters</label>
            <label><input type="checkbox" id="rule-verbs" checked> Check Verb Tenses</label>
            <label><input type="checkbox" id="rule-runon" checked> Check Run-Ons</label>
            <h3 style="margin-bottom: 5px; margin-top: 20px;">Topic Words</h3>
            <textarea id="topic-words-input" rows="3"></textarea>
            <div class="modal-buttons">
                <button id="save-settings-btn" style="background-color: #4CAF50; color: white;">Save</button>
                <button id="cancel-settings-btn" style="background-color: #d32f2f; color: white;">Close</button>
            </div>
        </div>
    </div>

    <script>
        let teacherSettings = JSON.parse(localStorage.getItem('vw_settings')) || { caps: true, verbs: true, runOn: true, topicWords: "" };
        let isEditMode = false;
        let isKeyboardMode = false;
        let isHoverMode = 0; 
        let isPictureHoverOn = false;
        let isSyllableMode = false;
        
        let fonts = [
            { family: "'Lexend', Verdana, sans-serif" },
            { family: "'Playpen Sans', cursive" },
            { family: "'Playwrite GB S', cursive" },
            { family: "'Comic Sans MS', cursive, sans-serif" }
        ];

        let textHistory = [];
        const pictureDictionary = { "dog":"🐶", "cat":"🐱", "car":"🚗", "house":"🏠", "apple":"🍎", "tree":"🌳", "sun":"☀️", "school":"🏫", "water":"💧", "fire":"🔥", "boy":"👦", "girl":"👧", "bird":"🐦", "fish":"🐟", "food":"🍔", "ball":"⚽", "flower":"🌸", "heart":"❤️", "run":"🏃", "jump":"🦘", "eat":"🍽️", "sleep":"😴", "happy":"😊", "sad":"😢" };

        const sentenceBox = document.getElementById('sentence-box');
        const statusText = document.getElementById('status');
        const rootVars = document.documentElement.style;

        // SPEECH SYNTHESIS
        let bestVoice = null;
        function loadBestVoice() {
            let voices = window.speechSynthesis.getVoices();
            let ukVoices = voices.filter(v => v.lang.includes('en-GB'));
            bestVoice = ukVoices.find(v => v.name.includes('Natural') || v.name.includes('Google')) || ukVoices[0] || voices[0];
        }
        window.speechSynthesis.onvoiceschanged = loadBestVoice;

        function speakText(text, rate = 0.9) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            if (bestVoice) utterance.voice = bestVoice;
            utterance.rate = rate;
            window.speechSynthesis.speak(utterance);
        }

        // FONT DROPDOWN
        document.getElementById('font-select').addEventListener('change', (e) => {
            rootVars.setProperty('--main-font', fonts[parseInt(e.target.value)].family);
        });

        // SYLLABLES
        document.getElementById('syllable-toggle-btn').addEventListener('click', (e) => {
            isSyllableMode = !isSyllableMode;
            e.target.innerText = isSyllableMode ? "✂️ Syl: ON" : "✂️ Syl: OFF";
            e.target.style.backgroundColor = isSyllableMode ? "#ff9800" : "#009688";
            if(!isKeyboardMode) renderChildSpans(getCurrentText());
        });

        // TEACHER / KEYBOARD MODE
        document.getElementById('teacher-mode-toggle-btn').addEventListener('click', (e) => {
            if (!isKeyboardMode) {
                let proceed = confirm("Entering Teacher Mode will temporarily remove editing features to allow free typing. Continue?");
                if (!proceed) return;
            }

            isKeyboardMode = !isKeyboardMode;
            e.target.innerText = isKeyboardMode ? "👩‍🏫 Teacher: ON" : "👩‍🏫 Teacher: OFF";
            e.target.style.backgroundColor = isKeyboardMode ? "#4caf50" : "#f44336";
            sentenceBox.classList.toggle('keyboard-active', isKeyboardMode);
            
            if (isKeyboardMode) {
                sentenceBox.innerText = getCurrentText();
                sentenceBox.setAttribute('contenteditable', 'true');
                sentenceBox.focus();
            } else {
                sentenceBox.setAttribute('contenteditable', 'false');
                renderChildSpans(getCurrentText());
            }
        });

        // UI TOGGLES
        const hoverBtn = document.getElementById('hover-read-toggle-btn');
        hoverBtn.addEventListener('click', () => {
            isHoverMode = (isHoverMode + 1) % 3;
            if (isHoverMode === 0) { hoverBtn.innerText = "🗣️ Hover: OFF"; hoverBtn.style.backgroundColor = "#00acc1"; }
            if (isHoverMode === 1) { hoverBtn.innerText = "🗣️ Hover: WORD"; hoverBtn.style.backgroundColor = "#ff9800"; }
            if (isHoverMode === 2) { hoverBtn.innerText = "🗣️ Hover: SOUNDS"; hoverBtn.style.backgroundColor = "#9c27b0"; }
            sentenceBox.classList.toggle('features-on', isHoverMode > 0 || isPictureHoverOn);
        });

        document.getElementById('picture-hover-toggle-btn').addEventListener('click', (e) => {
            isPictureHoverOn = !isPictureHoverOn;
            e.target.innerText = isPictureHoverOn ? "🖼️ Pics: ON" : "🖼️ Pics: OFF";
            e.target.style.backgroundColor = isPictureHoverOn ? "#ff9800" : "#e91e63";
            sentenceBox.classList.toggle('features-on', isHoverMode > 0 || isPictureHoverOn);
        });

        document.querySelectorAll('.swatch-btn').forEach(btn => {
            btn.addEventListener('click', () => rootVars.setProperty('--box-bg', btn.getAttribute('data-color')));
        });
        document.getElementById('tint-toggle-btn').addEventListener('click', () => {
            const bar = document.getElementById('color-tint-bar');
            bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
        });

        // COPY & PRINT
        document.getElementById('copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(getCurrentText()).then(() => {
                let btn = document.getElementById('copy-btn');
                let origText = btn.innerHTML;
                btn.innerHTML = "✅ Copied!";
                setTimeout(() => btn.innerHTML = origText, 1500);
            });
        });
        document.getElementById('print-btn').addEventListener('click', () => window.print());

        // SETTINGS
        const settingsModal = document.getElementById('settings-modal');
        document.getElementById('teacher-settings-btn').addEventListener('click', () => {
            document.getElementById('rule-caps').checked = teacherSettings.caps;
            document.getElementById('rule-verbs').checked = teacherSettings.verbs;
            document.getElementById('rule-runon').checked = teacherSettings.runOn;
            document.getElementById('topic-words-input').value = teacherSettings.topicWords;
            settingsModal.style.display = 'flex';
        });
        document.getElementById('cancel-settings-btn').addEventListener('click', () => settingsModal.style.display = 'none');
        document.getElementById('save-settings-btn').addEventListener('click', () => {
            teacherSettings.caps = document.getElementById('rule-caps').checked;
            teacherSettings.verbs = document.getElementById('rule-verbs').checked;
            teacherSettings.runOn = document.getElementById('rule-runon').checked;
            teacherSettings.topicWords = document.getElementById('topic-words-input').value;
            localStorage.setItem('vw_settings', JSON.stringify(teacherSettings));
            settingsModal.style.display = 'none';
            renderTopicWords();
            if(!isKeyboardMode) renderChildSpans(getCurrentText());
        });

        function renderTopicWords() {
            const container = document.getElementById('custom-words-container');
            container.innerHTML = '';
            if (!teacherSettings.topicWords) return;
            teacherSettings.topicWords.split(',').forEach(word => {
                let w = word.trim();
                if(!w) return;
                let btn = document.createElement('button');
                btn.className = 'topic-word-btn'; btn.innerText = w;
                btn.onclick = () => insertText(w);
                container.appendChild(btn);
            });
        }

        // TEXT PROCESSING - REBUILT TO PREVENT WORD MERGING
        function getCurrentText() {
            if (isKeyboardMode) {
                return sentenceBox.innerText.replace(/·/g, '').replace(/\s+/g, ' ').trim();
            }
            
            // Rebuild string securely by inspecting individual word spans, ignoring spacing visual bugs
            let textArray = [];
            sentenceBox.childNodes.forEach(node => {
                if (node.classList && (node.classList.contains('child-word') || node.classList.contains('child-punct'))) {
                    textArray.push(node.textContent.replace(/·/g, '').trim());
                }
            });
            // Re-join with proper spaces, then attach punctuation to preceding words
            return textArray.join(' ').replace(/\s+([.,!?"'])/g, '$1').trim();
        }

        function insertText(newWords) {
            if(isKeyboardMode) return; 
            saveHistory();
            let currentText = getCurrentText();
            if (currentText.length > 0 && !currentText.endsWith(' ')) currentText += " ";
            updateSentenceText(currentText + newWords);
        }

        function saveHistory() { textHistory.push(getCurrentText()); if(textHistory.length > 30) textHistory.shift(); }
        document.getElementById('undo-action-btn').addEventListener('click', () => { if(textHistory.length && !isKeyboardMode) updateSentenceText(textHistory.pop()); });

        // DELETE LOGIC
        document.getElementById('delete-btn').addEventListener('click', () => {
            if(isKeyboardMode) return;
            saveHistory();
            
            if (isEditMode) {
                let active = document.querySelector('.active-child-target');
                if (active) {
                    if(active.nextElementSibling && active.nextElementSibling.classList.contains('child-gap')) active.nextElementSibling.remove();
                    active.remove();
                    updateSentenceText(getCurrentText());
                    return;
                }
            }
            // Delete last word if nothing is selected or edit mode is off
            let currentText = getCurrentText();
            let words = currentText.match(/[a-zA-Z0-9'’]+|[.,!?"']/g) || [];
            words.pop(); 
            updateSentenceText(words.join(' '));
        });

        // PUNCTUATION
        document.querySelectorAll('.punct-btn').forEach(btn => {
            btn.addEventListener('click', () => insertText(btn.innerText));
        });

        function updateSentenceText(text) { renderChildSpans(text); }

        function formatSyllables(word) {
            if (!isSyllableMode || word.length < 4) return word;
            return word.replace(/([aeiouy]+[^aeiouy]*?)([aeiouy]+)/ig, "$1·$2");
        }

        function renderChildSpans(text) {
            let cleanText = text.replace(/·/g, '').replace(/\s+/g, ' ').trim();
            const tokens = cleanText.match(/[a-zA-Z0-9'’]+|[.,!?"']/g) || [];
            sentenceBox.innerHTML = '';
            
            let capNext = true;
            let errorCount = 0;
            
            // Using &nbsp; protects against browser layout engines collapsing our gaps
            const createGap = () => { let g = document.createElement('span'); g.className='child-gap'; g.innerHTML='&nbsp;'; return g; };
            sentenceBox.appendChild(createGap());

            for (let idx = 0; idx < tokens.length; idx++) {
                const token = tokens[idx];
                const span = document.createElement('span');
                
                if (/^[.,!?"']$/.test(token)) {
                    span.className = 'child-punct';
                    span.innerText = token;
                    if (/[.!?]/.test(token)) capNext = true;
                } else {
                    span.className = 'child-word';
                    let firstChar = token.charAt(0);
                    let isCapitalized = firstChar === firstChar.toUpperCase() && /[A-Z]/.test(firstChar);
                    let isI = /^i(['’][a-z]+)?$/i.test(token);
                    let activeHint = "";

                    if (teacherSettings.caps && /[a-zA-Z]/.test(firstChar)) {
                        if ((capNext || isI) && !isCapitalized) { span.classList.add('capital-error'); activeHint = "Needs a capital letter!"; errorCount++; }
                        else if (!capNext && !isI && isCapitalized) { span.classList.add('capital-error'); activeHint = "Should this be lowercase?"; errorCount++; }
                    }
                    capNext = false;

                    let cleanToken = token.toLowerCase();
                    if (teacherSettings.verbs) {
                        let prevWord = idx > 0 && !/^[.,!?"']$/.test(tokens[idx-1]) ? tokens[idx-1].toLowerCase() : null;
                        if (cleanToken === 'were' && prevWord === 'i') { span.classList.add('grammar-error'); activeHint = "Use 'I was'!"; errorCount++; }
                        if (cleanToken === 'seen' && prevWord === 'i') { span.classList.add('grammar-error'); activeHint = "Use 'I saw'!"; errorCount++; }
                    }

                    span.innerHTML = formatSyllables(token);
                    
                    span.addEventListener('mouseenter', (e) => {
                        if (isHoverMode === 1) speakText(cleanToken, 0.85);
                        if (isHoverMode === 2) speakText(cleanToken.split('').join(' '), 0.4); 
                        
                        if (isPictureHoverOn && pictureDictionary[cleanToken]) {
                            let pt = document.getElementById('picture-tooltip');
                            pt.innerText = pictureDictionary[cleanToken];
                            pt.style.display = 'block';
                            pt.style.left = e.clientX + 'px'; pt.style.top = e.clientY + 'px';
                        }
                        if (isEditMode && activeHint && !isKeyboardMode) {
                            let gt = document.getElementById('grammar-tooltip');
                            gt.innerHTML = "💡 " + activeHint;
                            gt.style.display = 'block';
                            gt.style.left = e.clientX + 'px'; gt.style.top = e.clientY + 'px';
                        }
                    });
                    span.addEventListener('mousemove', (e) => {
                        document.getElementById('picture-tooltip').style.left = e.clientX + 'px'; document.getElementById('picture-tooltip').style.top = e.clientY + 'px';
                        document.getElementById('grammar-tooltip').style.left = e.clientX + 'px'; document.getElementById('grammar-tooltip').style.top = e.clientY + 'px';
                    });
                    span.addEventListener('mouseleave', () => { document.getElementById('picture-tooltip').style.display = 'none'; document.getElementById('grammar-tooltip').style.display = 'none'; });
                    
                    if(isEditMode) span.onclick = () => { document.querySelectorAll('.active-child-target').forEach(e=>e.classList.remove('active-child-target')); span.classList.add('active-child-target'); };
                }
                sentenceBox.appendChild(span);
                sentenceBox.appendChild(createGap());
            }

            const badge = document.getElementById('fix-it-badge');
            if (isEditMode && !isKeyboardMode && errorCount > 0) {
                badge.style.display = 'block'; badge.innerText = `🎯 ${errorCount} fix${errorCount > 1 ? 'es' : ''} needed!`; badge.style.backgroundColor = "#ffeb3b";
            } else if (isEditMode && !isKeyboardMode && tokens.length > 0 && errorCount === 0) {
                badge.style.display = 'block'; badge.innerText = `🌟 Perfect!`; badge.style.backgroundColor = "#81c784";
            } else { badge.style.display = 'none'; }
        }

        // READ & CHECK
        document.getElementById('read-sentence-btn').addEventListener('click', () => {
            let text = getCurrentText();
            if(!text) return;
            window.speechSynthesis.cancel();
            
            let utterance = new SpeechSynthesisUtterance(text);
            if (bestVoice) utterance.voice = bestVoice;
            utterance.rate = 0.85;

            let spans = document.querySelectorAll('#sentence-box span:not(.child-gap)');
            let wordIndex = 0;

            utterance.onboundary = (e) => {
                if(e.name === 'word' && !isKeyboardMode) {
                    spans.forEach(s => s.classList.remove('speaking-highlight'));
                    while(wordIndex < spans.length && spans[wordIndex].classList.contains('child-punct')) { wordIndex++; }
                    if(wordIndex < spans.length) { spans[wordIndex].classList.add('speaking-highlight'); wordIndex++; }
                }
            };
            utterance.onend = () => { spans.forEach(s => s.classList.remove('speaking-highlight')); };
            window.speechSynthesis.speak(utterance);
        });

        // SPEECH RECOGNITION
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            document.getElementById('listen-btn').onclick = () => { if(!isKeyboardMode){ recognition.start(); statusText.innerText = "🎙️ Listening..."; }};
            document.getElementById('stop-btn').onclick = () => { recognition.stop(); statusText.innerText = "Stopped."; };
            recognition.onresult = (event) => {
                let phrase = event.results[0][0].transcript;
                insertText(phrase);
                statusText.innerText = "Heard: " + phrase;
            };
        }

        document.getElementById('edit-toggle-btn').addEventListener('click', (e) => {
            isEditMode = !isEditMode;
            e.target.innerText = isEditMode ? "✏️ Edit: ON" : "✏️ Edit: OFF";
            e.target.style.backgroundColor = isEditMode ? "#ff9800" : "#00796b";
            if(!isKeyboardMode) {
                sentenceBox.classList.toggle('child-edit-active', isEditMode);
                renderChildSpans(getCurrentText());
            }
        });

        renderTopicWords();
        renderChildSpans("This is a test. i am jumping while he seen a dog!");
    </script>
</body>
</html>
