<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Choice Writer</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 20px;
            color: #333;
        }
        h1 { color: #00796b; }
        
        #sentence-box {
            background: white;
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            min-height: 120px;
            padding: 20px;
            font-size: 36px;
            margin: 20px auto;
            max-width: 800px;
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.5;
        }

        .controls-group {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            font-family: inherit;
            font-size: 22px;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px #999;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0px #999;
        }

        #listen-btn { background-color: #4CAF50; color: white; box-shadow: 0 4px #388E3C; font-weight: bold; }
        #listen-btn:active { box-shadow: 0 0px #388E3C; }
        
        .punct-btn { background-color: #FF9800; color: white; box-shadow: 0 4px #F57C00; }
        .punct-btn:active { box-shadow: 0 0px #F57C00; }
        
        .action-btn { background-color: #2196F3; color: white; box-shadow: 0 4px #1976D2; }
        .action-btn:active { box-shadow: 0 0px #1976D2; }
        
        #clear-btn { background-color: #f44336; color: white; box-shadow: 0 4px #d32f2f; }
        #clear-btn:active { box-shadow: 0 0px #d32f2f; }
        
        #options-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
            min-height: 80px;
        }

        .option-btn {
            background-color: #9c27b0;
            color: white;
            box-shadow: 0 4px #7b1fa2;
            font-size: 32px;
            padding: 20px 40px;
            animation: popIn 0.3s ease-out;
        }
        .option-btn:active { box-shadow: 0 0px #7b1fa2; }

        #status {
            font-size: 20px;
            color: #555;
            margin-top: 10px;
            font-weight: bold;
            height: 30px;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>🎙️ Voice Choice Writer ✍️</h1>
    
    <!-- Top Controls: Listening and Punctuation -->
    <div class="controls-group">
        <button id="listen-btn">🎤 Start Listening</button>
        <button id="comma-btn" class="punct-btn">, Comma</button>
        <button id="period-btn" class="punct-btn">. Full Stop</button>
    </div>

    <!-- The Sentence -->
    <div id="sentence-box"></div>
    
    <!-- Bottom Controls: Actions -->
    <div class="controls-group">
        <button id="copy-btn" class="action-btn">📋 Copy to Google Docs</button>
        <button id="clear-btn">🗑️ Clear</button>
    </div>

    <div id="status">Click "Start Listening" to begin!</div>
    <div id="options-container"></div>

    <script>
        // Setup Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isAutoListening = false;
        
        if (!SpeechRecognition) {
            document.getElementById('status').innerText = "Oops! Your browser doesn't support voice typing. Try Google Chrome!";
        } else {
            recognition = new SpeechRecognition();
            recognition.maxAlternatives = 3; 
            recognition.continuous = false; 
            recognition.interimResults = false;
            recognition.lang = 'en-GB'; // Tuned for UK English!

            const listenBtn = document.getElementById('listen-btn');
            const commaBtn = document.getElementById('comma-btn');
            const periodBtn = document.getElementById('period-btn');
            const copyBtn = document.getElementById('copy-btn');
            const clearBtn = document.getElementById('clear-btn');
            const sentenceBox = document.getElementById('sentence-box');
            const optionsContainer = document.getElementById('options-container');
            const statusText = document.getElementById('status');

            // --- FUNCTIONS --- //

            function triggerListen() {
                try {
                    recognition.start();
                    statusText.innerText = "Listening... speak your word! 👂";
                    listenBtn.style.backgroundColor = "#FFEB3B"; // yellow
                    listenBtn.style.color = "#333";
                    listenBtn.innerText = "Listening...";
                } catch (e) {
                    // Prevents error if microphone is already engaged
                }
            }

            function stopListeningUI() {
                listenBtn.style.backgroundColor = "#4CAF50";
                listenBtn.style.color = "white";
                listenBtn.innerText = "🎤 Start Listening";
            }

            // Handles spacing so punctuation looks correct (e.g. "word ." becomes "word.")
            function addPunctuation(mark) {
                let text = sentenceBox.innerText;
                if (text.endsWith(' ')) {
                    text = text.slice(0, -1);
                }
                sentenceBox.innerText = text + mark + ' ';
            }

            // Speak word aloud on hover using Text-to-Speech
            function speakWord(word) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Stop anything currently speaking
                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.rate = 0.8; // Slightly slower for clarity
                    window.speechSynthesis.speak(utterance);
                }
            }

            // --- BUTTON CLICKS --- //

            listenBtn.addEventListener('click', () => {
                optionsContainer.innerHTML = '';
                isAutoListening = true; // Turn on the auto-loop
                triggerListen();
            });

            commaBtn.addEventListener('click', () => {
                addPunctuation(',');
                if (isAutoListening) triggerListen(); // Keep listening loop going
            });

            periodBtn.addEventListener('click', () => {
                addPunctuation('.');
                isAutoListening = false; // Turn OFF listening loop when sentence ends
                statusText.innerText = "Sentence complete! Ready for a new one.";
                optionsContainer.innerHTML = '';
                stopListeningUI();
            });

            copyBtn.addEventListener('click', () => {
                const text = sentenceBox.innerText.trim();
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        const originalText = copyBtn.innerText;
                        copyBtn.innerText = "✅ Copied to Clipboard!";
                        setTimeout(() => copyBtn.innerText = originalText, 2500); // Change back after 2.5s
                    });
                }
            });

            clearBtn.addEventListener('click', () => {
                sentenceBox.innerText = '';
                optionsContainer.innerHTML = '';
                isAutoListening = false;
                statusText.innerText = "Cleared. Click start when ready.";
                stopListeningUI();
            });

            // --- SPEECH RECOGNITION LOGIC --- //

            recognition.onresult = (event) => {
                const results = event.results[0];
                optionsContainer.innerHTML = ''; 
                statusText.innerText = "Pick the right word! (Hover to hear) 👇";
                stopListeningUI();

                let uniqueWords = new Set();
                
                for (let i = 0; i < results.length; i++) {
                    let word = results[i].transcript.trim().toLowerCase();
                    word = word.replace(/[.,!?]/g, ''); 
                    
                    if (word && !uniqueWords.has(word)) {
                        uniqueWords.add(word);
                        
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.innerText = word;
                        
                        // Read aloud on hover
                        btn.onmouseenter = () => speakWord(word);

                        // Word selected by child
                        btn.onclick = () => {
                            // Capitalize if it's the first word of the box or right after a full stop
                            if (sentenceBox.innerText.length === 0 || sentenceBox.innerText.endsWith('. ')) {
                                word = word.charAt(0).toUpperCase() + word.slice(1);
                            }
                            
                            sentenceBox.innerText += word + ' ';
                            optionsContainer.innerHTML = '';
                            
                            // AUTO-LISTEN TRIGGER
                            if (isAutoListening) {
                                statusText.innerText = "Great! Getting ready for next word...";
                                // Wait just under 1 second so they see the word appear before mic starts again
                                setTimeout(() => {
                                    if (isAutoListening) triggerListen();
                                }, 800);
                            } else {
                                statusText.innerText = "Word added.";
                            }
                        };
                        
                        optionsContainer.appendChild(btn);
                        if (uniqueWords.size === 3) break; 
                    }
                }

                if (uniqueWords.size === 0) {
                    statusText.innerText = "Didn't catch that. Try again!";
                    if (isAutoListening) {
                        setTimeout(triggerListen, 1500);
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    statusText.innerText = "Didn't hear anything. Taking a break.";
                    // If no speech is detected, turn off auto-listen so it doesn't loop infinitely
                    isAutoListening = false;
                    stopListeningUI();
                } else {
                    statusText.innerText = "Error: " + event.error;
                    isAutoListening = false;
                    stopListeningUI();
                }
            };

            recognition.onend = () => {
                // Ensure UI goes back to green button if we aren't looping
                if (optionsContainer.innerHTML === '' && !isAutoListening) {
                    stopListeningUI();
                }
            };
        }
    </script>
</body>
</html>
