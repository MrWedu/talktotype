<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Choice Writer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap');

        :root {
            --box-bg: #ffffff;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Lexend', Verdana, Tahoma, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 12px;
            margin: 0;
            color: #222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        h1 { 
            color: #00796b; 
            margin: 0 0 8px 0;
            font-size: clamp(20px, 3vw, 26px);
            flex-shrink: 0;
        }

        #contrast-toggle-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: #37474f;
            color: white;
            box-shadow: 0 3px #263238;
            font-size: 22px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            z-index: 100;
        }

        .app-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            flex-grow: 1;
            height: calc(100% - 40px);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
        }

        .edit-header {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            background: #b2dfdb;
            padding: 6px 12px;
            border-radius: 10px;
            border: 2px solid #00796b;
            flex-wrap: wrap;
        }

        .color-tint-bar {
            display: none; 
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: #e0f2f1;
            padding: 6px 12px;
            border-radius: 10px;
            border: 2px solid #00796b;
            flex-wrap: wrap;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tint-label {
            font-size: 14px;
            font-weight: 600;
            color: #00796b;
            margin-right: 4px;
        }

        .swatch-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #888;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 2px #666;
            padding: 0;
        }

        .swatch-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px #666;
        }

        .swatch-btn.active-swatch {
            border: 3px solid #000;
            transform: scale(1.15);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .mode-btn {
            background-color: #00796b;
            color: white;
            font-weight: bold;
            box-shadow: 0 3px #004d40;
            padding: 6px 14px;
            flex: 1;
            min-width: 130px;
        }

        #sentence-box {
            background-color: var(--box-bg) !important;
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            flex-grow: 1;
            padding: 18px;
            font-size: clamp(22px, 3.2vw, 30px);
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            outline: none;
            transition: all 0.3s ease;
        }

        #sentence-box.child-edit-active {
            border: 4px solid #ff9800 !important;
            white-space: normal;
        }

        #sentence-box.teacher-edit-active {
            border: 4px solid #9c27b0 !important;
        }
        
        .child-gap {
            display: inline;
            transition: background 0.2s;
        }
        .child-word {
            display: inline-block;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .child-punct {
            display: inline-block;
            font-weight: 900;
            color: inherit;
            transition: all 0.2s;
        }

        #sentence-box.features-on:not(.child-edit-active) .child-word:hover {
            background-color: rgba(0, 188, 212, 0.15);
            cursor: pointer;
        }

        #sentence-box.child-edit-active .child-gap {
            display: inline-block;
            width: 20px;
            height: 28px;
            margin: 0 2px;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            cursor: pointer;
            vertical-align: middle;
        }
        #sentence-box.child-edit-active .child-gap:hover { background-color: rgba(0, 0, 0, 0.15); }
        
        #sentence-box.child-edit-active .child-word {
            padding: 2px 6px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        #sentence-box.child-edit-active .child-word:hover {
            background-color: rgba(255, 235, 59, 0.6);
            border-color: #fbc02d;
        }

        /* CAPITAL ERROR STYLING */
        #sentence-box.child-edit-active .child-word.capital-error {
            background-color: #fce4ec;
            border-color: #f48fb1;
            color: #000;
        }
        #sentence-box.child-edit-active .child-word.capital-error:hover {
            background-color: #f8bbd0;
            border-color: #f06292;
        }

        /* GRAMMAR ERROR STYLING (UK Primary Curriculum) */
        #sentence-box.child-edit-active .child-word.grammar-error {
            background-color: #f3e5f5;
            border-color: #ba68c8;
            text-decoration: underline wavy #7b1fa2;
            color: #000;
        }
        #sentence-box.child-edit-active .child-word.grammar-error:hover {
            background-color: #e1bee7;
            border-color: #8e24aa;
        }

        #sentence-box.child-edit-active .child-punct {
            padding: 2px 6px;
            margin: 0 1px;
            border-radius: 4px;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.05);
            border: 2px solid transparent;
            vertical-align: middle;
        }
        #sentence-box.child-edit-active .child-punct:hover {
            background-color: rgba(0, 0, 0, 0.15);
        }

        .active-child-target {
            background-color: #ffeb3b !important;
            border: 2px solid #f57f17 !important;
            color: #000000 !important;
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            justify-content: flex-start;
        }

        .controls-group {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            width: 100%;
        }

        button {
            font-family: inherit;
            font-size: clamp(13px, 1.5vw, 16px);
            padding: 8px 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 3px #777;
            white-space: nowrap;
        }
        
        button:active {
            transform: translateY(3px);
            box-shadow: 0 0px #777;
        }

        #listen-btn { background-color: #2e7d32; color: #ffffff; box-shadow: 0 3px #1b5e20; font-weight: bold; flex: 1; }
        #stop-btn { background-color: #c2185b; color: #ffffff; box-shadow: 0 3px #880e4f; font-weight: bold; flex: 1; }
        
        .punct-btn { 
            background-color: #1a237e; 
            color: #ffffff; 
            box-shadow: 0 3px #0d47a1; 
            font-size: 22px;
            font-weight: 900;
            padding: 6px 14px;
            flex: 1;
            border: 2px solid #000000;
        }
        
        .action-btn { background-color: #0277bd; color: #ffffff; box-shadow: 0 3px #01579b; flex: 1;}
        #print-btn { background-color: #00796b; color: #ffffff; box-shadow: 0 3px #004d40; font-weight: bold; flex: 1;}
        #undo-action-btn { background-color: #f57c00; color: #ffffff; box-shadow: 0 3px #e65100; font-weight: bold; flex: 1;}
        #delete-btn { background-color: #e53935; color: #ffffff; box-shadow: 0 3px #b71c1c; font-weight: bold; flex: 1;}
        #capitalize-btn { background-color: #43a047; color: #ffffff; box-shadow: 0 3px #1b5e20; font-weight: bold; flex: 1; display: none; }
        
        #hover-read-toggle-btn { background-color: #00acc1; color: #ffffff; box-shadow: 0 3px #00838f; font-weight: bold; flex: 1; }
        #picture-hover-toggle-btn { background-color: #e91e63; color: #ffffff; box-shadow: 0 3px #c2185b; font-weight: bold; flex: 1; }

        #clear-btn { background-color: #424242; color: #ffffff; box-shadow: 0 3px #212121; flex: 1;}
        #restore-btn { background-color: #00897b; color: #ffffff; box-shadow: 0 3px #004d40; font-weight: bold; display: none; flex: 1;}
        #read-sentence-btn { background-color: #6a1b9a; color: #ffffff; box-shadow: 0 3px #4a148c; flex: 1;}
        
        #options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
            flex-grow: 1;
            justify-content: space-evenly;
            overflow-y: auto;
        }

        .option-btn {
            background-color: #6a1b9a;
            color: #ffffff;
            box-shadow: 0 4px #4a148c;
            font-size: clamp(22px, 3.2vw, 30px);
            padding: 12px;
            width: 100%;
            animation: popIn 0.3s ease-out;
            word-wrap: break-word;
            font-family: inherit;
        }

        .cancel-option-btn {
            background-color: #d32f2f !important;
            box-shadow: 0 4px #b71c1c !important;
            margin-top: 8px;
        }

        #status {
            font-size: clamp(14px, 1.8vw, 17px);
            color: #222222;
            font-weight: bold;
            min-height: 24px;
            margin: 2px 0;
            transition: color 0.3s;
        }

        body.high-contrast { background-color: #121212; color: #ffffff; }
        body.high-contrast h1 { color: #ffeb3b; }
        body.high-contrast #status { color: #00e5ff; }
        body.high-contrast .edit-header, body.high-contrast .color-tint-bar { background: #000000; border-color: #ffeb3b; }
        
        body.high-contrast #sentence-box { background-color: #1e1e1e !important; color: #ffffff; border: 4px solid #ffeb3b; }
        body.high-contrast #sentence-box.child-edit-active { border: 4px solid #00e5ff !important; }
        body.high-contrast #sentence-box.teacher-edit-active { border: 4px solid #ff5252 !important; }
        
        body.high-contrast #sentence-box.features-on:not(.child-edit-active) .child-word:hover { background-color: rgba(0, 229, 255, 0.3); }

        body.high-contrast #sentence-box.child-edit-active .child-gap { background-color: #333; }
        body.high-contrast #sentence-box.child-edit-active .child-gap:hover { background-color: #555; }
        body.high-contrast #sentence-box.child-edit-active .child-word:hover { background-color: #333; border-color: #ffeb3b; }
        
        body.high-contrast #sentence-box.child-edit-active .child-word.capital-error { background-color: #5c0029; border-color: #ff80ab; color: white; }
        body.high-contrast #sentence-box.child-edit-active .child-word.capital-error:hover { background-color: #880e4f; border-color: #ff80ab; }

        body.high-contrast #sentence-box.child-edit-active .child-word.grammar-error { background-color: #4a148c; border-color: #ea80fc; color: white; text-decoration: underline wavy #ea80fc; }
        body.high-contrast #sentence-box.child-edit-active .child-word.grammar-error:hover { background-color: #6a1b9a; border-color: #ea80fc; }

        body.high-contrast #sentence-box.child-edit-active .child-punct { color: #ffffff; background-color: #333; }
        body.high-contrast #sentence-box.child-edit-active .child-punct:hover { background-color: #555; }
        
        body.high-contrast .active-child-target { background-color: #000000 !important; border: 2px solid #00e5ff !important; color: #00e5ff !important; }
        body.high-contrast button { border: 2px solid #ffffff; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 4px solid #d32f2f;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            animation: popIn 0.2s ease-out;
            color: black;
        }

        .modal-box h2 { margin-top: 0; color: #d32f2f; font-size: 26px; }
        .teacher-modal-box h2 { color: #9c27b0; }
        .teacher-modal-box { border-color: #9c27b0; }

        .modal-box p { font-size: 18px; color: #333; margin-bottom: 20px; }
        .modal-buttons { display: flex; justify-content: center; gap: 12px; }

        #confirm-clear-btn { background-color: #d32f2f; color: white; box-shadow: 0 3px #b71c1c; font-weight: bold; }
        #confirm-teacher-btn { background-color: #9c27b0; color: white; box-shadow: 0 3px #7b1fa2; font-weight: bold; }
        .cancel-btn { background-color: #757575; color: white; box-shadow: 0 3px #424242; }

        /* PICTURE TOOLTIP */
        #picture-tooltip {
            position: fixed;
            display: none;
            background: white;
            border: 3px solid #e91e63;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            font-size: 60px;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -110%);
        }

        /* CHILD-FRIENDLY GRAMMAR HINT TOOLTIP */
        #grammar-tooltip {
            position: fixed;
            display: none;
            background: #fff8e1;
            border: 4px solid #ff9800;
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            font-size: 20px;
            font-weight: 600;
            color: #222222;
            z-index: 9999;
            pointer-events: none;
            max-width: 320px;
            line-height: 1.4;
            transform: translate(-50%, -120%);
            animation: popIn 0.15s ease-out;
            text-align: center;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 650px) {
            .app-container { flex-direction: column; }
            .left-panel { height: 40%; }
            #options-container { flex-direction: row; flex-wrap: wrap; }
            .option-btn { flex: 1; min-width: 100px; }
            .cancel-option-btn { min-width: 100%; margin-top: 0; }
        }

        @media print {
            body { background-color: white !important; padding: 0 !important; margin: 0 !important; height: auto !important; overflow: visible !important; color: black !important; }
            h1, .right-panel, .edit-header, .color-tint-bar, .modal-overlay, #status, #contrast-toggle-btn, #picture-tooltip, #grammar-tooltip { display: none !important; }
            .app-container { display: block !important; max-width: 100% !important; height: auto !important; }
            .left-panel { width: 100% !important; height: auto !important; }
            #sentence-box {
                border: none !important; box-shadow: none !important; padding: 0 !important; font-size: 24pt !important; color: black !important; background: white !important;
                font-family: Arial, sans-serif !important; line-height: 1.6 !important; overflow: visible !important; white-space: pre-wrap !important;
            }
        }
    </style>
</head>
<body>

    <button id="contrast-toggle-btn" title="Toggle High Contrast">🌓</button>

    <h1>🎙️ Voice Choice Writer ✍️</h1>
    
    <div class="app-container">
        <!-- LEFT: Scrollable Sentence Box & Edit Bar -->
        <div class="left-panel">
            <div class="edit-header">
                <button id="tint-toggle-btn" class="mode-btn" style="background-color: #0288d1;">🎨 Color: OFF</button>
                <button id="edit-toggle-btn" class="mode-btn">✏️ Edit Mode: OFF</button>
                <button id="teacher-toggle-btn" class="mode-btn">👩‍🏫 Teacher Mode: OFF</button>
            </div>
            
            <div class="color-tint-bar" id="color-tint-bar" title="Change Background Tint">
                <span class="tint-label">Tint:</span>
                <button class="swatch-btn" data-color="#ffffff" style="background-color: #ffffff;" title="White"></button>
                <button class="swatch-btn" data-color="#E6F2A2" style="background-color: #E6F2A2;" title="Celery"></button>
                <button class="swatch-btn" data-color="#FFD6E5" style="background-color: #FFD6E5;" title="Pink"></button>
                <button class="swatch-btn" data-color="#FFE0B2" style="background-color: #FFE0B2;" title="Orange"></button>
                <button class="swatch-btn" data-color="#C8E6C9" style="background-color: #C8E6C9;" title="Grass"></button>
                <button class="swatch-btn" data-color="#B3E5FC" style="background-color: #B3E5FC;" title="Sky"></button>
                <button class="swatch-btn" data-color="#FFF9C4" style="background-color: #FFF9C4;" title="Yellow"></button>
                <button class="swatch-btn" data-color="#B2DFDB" style="background-color: #B2DFDB;" title="Jade"></button>
                <button class="swatch-btn" data-color="#F8BBD0" style="background-color: #F8BBD0;" title="Magenta"></button>
                <button class="swatch-btn" data-color="#E1BEE7" style="background-color: #E1BEE7;" title="Purple"></button>
                <button class="swatch-btn" data-color="#B2EBF2" style="background-color: #B2EBF2;" title="Aqua"></button>
            </div>

            <div id="sentence-box" contenteditable="false"></div>
        </div>

        <!-- RIGHT: Controls and Choices -->
        <div class="right-panel">
            <div class="controls-group">
                <button id="listen-btn">🎤 Start Listening</button>
                <button id="stop-btn">🛑 Stop Listening</button>
            </div>

            <div class="controls-group">
                <button id="comma-btn" class="punct-btn">,</button>
                <button id="period-btn" class="punct-btn">.</button>
                <button id="question-btn" class="punct-btn">?</button>
                <button id="exclamation-btn" class="punct-btn">!</button>
                <button id="quote-btn" class="punct-btn">"</button>
            </div>

            <div class="controls-group">
                <button id="undo-action-btn">↺ Undo</button>
                <button id="delete-btn">⌫ Delete</button>
                <button id="capitalize-btn">🔠 Capitalize</button>
            </div>

            <div class="controls-group">
                <button id="read-sentence-btn">🔊 Read</button>
                <button id="hover-read-toggle-btn">🗣️ Hover Read: OFF</button>
                <button id="picture-hover-toggle-btn">🖼️ Picture Hover: OFF</button>
            </div>

            <div class="controls-group">
                <button id="copy-btn" class="action-btn">📋 Copy</button>
                <button id="print-btn">🖨️ Print</button>
                <button id="clear-btn">🗑️ Clear</button>
                <button id="restore-btn">↩️ Restore</button>
            </div>

            <div id="status">Click "Start Listening" when ready!</div>
            
            <div id="options-container"></div>
        </div>
    </div>

    <!-- Floating Tooltips -->
    <div id="picture-tooltip"></div>
    <div id="grammar-tooltip"></div>

    <!-- MODALS -->
    <div id="clear-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>⚠️ Are you sure?</h2>
            <p>Do you really want to clear all your writing?</p>
            <div class="modal-buttons">
                <button id="confirm-clear-btn">Yes, Clear</button>
                <button class="cancel-btn" id="cancel-clear-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="teacher-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box teacher-modal-box">
            <h2>👩‍🏫 Teacher Mode</h2>
            <p><strong>Warning!</strong> This unlocks the keyboard.<br>Only adults should use this mode.</p>
            <div class="modal-buttons">
                <button id="confirm-teacher-btn">Yes, I am an adult</button>
                <button class="cancel-btn" id="cancel-teacher-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // --- ALWAYS-ON SAFETY FILTER --- //
        const blockedWords = new Set([
            'fuck', 'fucking', 'shit', 'shitting', 'bitch', 'ass', 'asshole', 'cunt', 
            'dick', 'cock', 'pussy', 'whore', 'slut', 'bastard', 'damn', 'crap', 'sex', 
            'porn', 'boob', 'boobs', 'vagina', 'penis', 'tit', 'tits', 'cum'
        ]);

        function isBadWord(word) {
            if (!word) return false;
            const clean = word.toLowerCase().replace(/[^a-z]/g, '');
            return blockedWords.has(clean);
        }

        // --- SHUFFLE HELPER --- //
        function shuffleArray(arr) {
            let shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isAutoListening = false;
        let isListeningActive = false;
        
        let isTintOpen = false;
        let isEditMode = false; 
        let isTeacherMode = false;
        let isHighContrast = false;
        let isHoverReadOn = false;
        let isPictureHoverOn = false;

        let restartTimer = null;
        let audioCtx = null;
        
        let phraseQueue = [];
        let backupText = ""; 
        let textHistory = [];

        // --- PICTURE DICTIONARY --- //
        const pictureDictionary = {
            "dog": "🐶", "dogs": "🐶", "puppy": "🐶",
            "cat": "🐱", "cats": "🐱", "kitten": "🐱",
            "car": "🚗", "cars": "🚗", "truck": "🛻",
            "house": "🏠", "houses": "🏠", "home": "🏡",
            "apple": "🍎", "apples": "🍎",
            "tree": "🌳", "trees": "🌳",
            "sun": "☀️", "moon": "🌙",
            "star": "⭐", "stars": "⭐",
            "book": "📖", "books": "📚",
            "school": "🏫", "teacher": "👩‍🏫",

        function loadBestVoice() {

            let enVoices = voices.filter(v => v.lang.startsWith('en'));
            let voicePool = ukVoices.length > 0 ? ukVoices : (enVoices.length > 0 ? enVoices : voices);
            bestVoice = voicePool.find(v => v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Google')) || voicePool[0]; 
        }
        
        if (window.speechSynthesis.onvoiceschanged !== undefined) {

            utterance.rate = rate; 
            utterance.pitch = 1.05; 
            window.speechSynthesis.speak(utterance);
        }

            // --- EXPANDED OFFLINE GRAMMAR & STRUCTURE ENGINE --- //
            function renderChildSpans(text) {
                let cleanText = text.replace(/\s+/g, ' ').trim();
                const tokens = cleanText.match(/[a-zA-Z0-9'’]+|[.,!?"']/g) || [];
                
                sentenceBox.innerHTML = '';
                sentenceBox.appendChild(createGapSpan()); 
                
                let capNext = true;

                // Pre-scan for Run-On Sentences & Unpunctuated Clause Boundaries
                const conjunctions = ['and', 'but', 'so', 'because', 'or', 'then'];
                let currentConjCount = 0;
                let currentSentenceIndices = [];
                let runOnIndices = new Set();
                let clauseSubjectIndices = new Set();

                const subjects = ['i', 'he', 'she', 'it', 'we', 'they', 'cerberus', 'my friend', 'the dog', 'the cat'];
                let seenSubjectInClause = false;

                tokens.forEach((t, i) => {
                    const lowerT = t.toLowerCase();
                    if (/^[.,!?]$/.test(t)) {
                        if (currentConjCount >= 3) {
                            currentSentenceIndices.forEach(idx => runOnIndices.add(idx));
                        }
                        currentConjCount = 0;
                        currentSentenceIndices = [];
                        seenSubjectInClause = false;
                    } else {
                        if (conjunctions.includes(lowerT)) {
                            currentConjCount++;
                            currentSentenceIndices.push(i);
                        }
                        if (subjects.includes(lowerT)) {
                            if (seenSubjectInClause && i > 0 && !/^[.,!?]$/.test(tokens[i - 1])) {
                                clauseSubjectIndices.add(i);
                            }
                            seenSubjectInClause = true;
                        }
                    }
                });

                if (currentConjCount >= 3) {
                    currentSentenceIndices.forEach(idx => runOnIndices.add(idx));
                }
                
                for (let idx = 0; idx < tokens.length; idx++) {
                    const token = tokens[idx];
                    const isPunct = /^[.,!?"']$/.test(token);
                    const span = document.createElement('span');
                    
                    if (isPunct) {
                        span.className = 'child-punct';
                        if (/[.!?]/.test(token)) { capNext = true; }
                    } else {
                        span.className = 'child-word';
                        
                        let firstChar = token.charAt(0);
                        let isLetter = /[a-zA-Z]/.test(firstChar);
                        let isCapitalized = (firstChar === firstChar.toUpperCase() && firstChar !== firstChar.toLowerCase());
                        let isI = /^i(['’][a-z]+)?$/i.test(token);
                        
                        let activeHint = "";

                        // 1. Capitalization Checking
                        if (isLetter) {
                            let hasCapError = false;
                            if (capNext || isI) {
                                if (!isCapitalized) hasCapError = true;
                            } else {
                                if (isCapitalized) hasCapError = true;
                            }
                            if (hasCapError) { 
                                span.classList.add('capital-error'); 
                                activeHint = "Sentences and 'I' should start with a capital letter!";
                            }
                        }
                        capNext = false; 

                        // 2. Offline Primary Grammar, Verb Tense & Structural Matrix
                        let hasGrammarError = false;
                        const cleanToken = token.toLowerCase();

                        // Lookahead Next Word
                        let nextWord = null;
                        for (let j = idx + 1; j < tokens.length; j++) {
                            if (!/^[.,!?"']$/.test(tokens[j])) {
                                nextWord = tokens[j].toLowerCase();
                                break;
                            }
                        }

                        // Lookback Previous Word
                        let prevWord = null;
                        for (let j = idx - 1; j >= 0; j--) {
                            if (!/^[.,!?"']$/.test(tokens[j])) {
                                prevWord = tokens[j].toLowerCase();
                                break;
                            }
                        }

                        // Rule A: Verb Conjugation - "I were" vs "I was"
                        if (cleanToken === 'were' && prevWord === 'i') {
                            hasGrammarError = true;
                            activeHint = "In UK English, we write <strong>'I was'</strong> instead of 'I were'!";
                        } 
                        // Rule B: Verb Conjugation - "we/they/you was" vs "were"
                        else if (cleanToken === 'was' && prevWord && ['we', 'they', 'you'].includes(prevWord)) {
                            hasGrammarError = true;
                            activeHint = "Write <strong>'" + prevWord + " were'</strong> instead of 'was'!";
                        } 
                        // Rule C: Irregular Past Tense Shift - "sneaks/sneak" vs "snuck"
                        else if (cleanToken === 'sneaks' || (cleanToken === 'sneak' && prevWord && ['went', 'saw', 'ran', 'walked', 'cerberus', 'had'].includes(prevWord))) {
                            hasGrammarError = true;
                            activeHint = "For a past action, try using <strong>'snuck'</strong> instead of 'sneaks'!";
                        } 
                        // Rule D: Spoken Dialect Forms - "I seen" / "I done"
                        else if (cleanToken === 'seen' && prevWord === 'i') {
                            hasGrammarError = true;
                            activeHint = "Write <strong>'I saw'</strong> or <strong>'I have seen'</strong>!";
                        } else if (cleanToken === 'done' && prevWord === 'i') {
                            hasGrammarError = true;
                            activeHint = "Write <strong>'I did'</strong> or <strong>'I have done'</strong>!";
                        } else if (cleanToken === 'goes' && prevWord && ['they', 'we'].includes(prevWord)) {
                            hasGrammarError = true;
                            activeHint = "Write <strong>'" + prevWord + " went'</strong> or <strong>'go'</strong>!";
                        }

                        // Rule E: Subject-Verb Mismatch - "friend go" / "dogs is"
                        else if (cleanToken === 'go' && prevWord === 'friend') {
                            hasGrammarError = true;
                            activeHint = "Write <strong>'my friend goes'</strong> or <strong>'went'</strong>!";
                        } else if (cleanToken === 'is' && prevWord && ['dogs', 'cats', 'cars', 'friends', 'they', 'we'].includes(prevWord)) {
                            hasGrammarError = true;
                            activeHint = "When talking about more than one, write <strong>'are'</strong> or <strong>'were'</strong>!";
                        }

                        // Rule F: A vs An Articles
                        if (cleanToken === 'a' && nextWord && (/^[aeiou]/.test(nextWord) || nextWord === 'hour')) {
                            hasGrammarError = true;
                            activeHint = "Use <strong>'an'</strong> before vowel sounds (e.g., 'an apple', 'an hour')!";
                        } else if (cleanToken === 'an' && nextWord && /^[bcdfghjklmnpqrstvwxyz]/.test(nextWord) && nextWord !== 'hour') {
                            hasGrammarError = true;
                            activeHint = "Use <strong>'a'</strong> before consonant sounds (e.g., 'a cat')!";
                        }

                        // Rule G: Missing Prepositions ("going park")
                        const places = ['park', 'school', 'shop', 'beach', 'zoo', 'house', 'garden', 'cinema'];
                        if (['going', 'went', 'walked', 'ran'].includes(cleanToken) && places.includes(nextWord)) {
                            hasGrammarError = true;
                            activeHint = "You might be missing <strong>'to the'</strong> before '" + nextWord + "'!";
                        } else if (cleanToken === 'i' && ['going', 'playing', 'eating', 'running', 'walking'].includes(nextWord)) {
                            hasGrammarError = true;
                            activeHint = "You might be missing <strong>'am'</strong> or <strong>'was'</strong> after 'I'!";
                        }

                        // Rule H: Common Homophone Swaps ("went of the slide")
                        if (cleanToken === 'of' && prevWord && ['fell', 'jumped', 'ran', 'went', 'got'].includes(prevWord)) {
                            hasGrammarError = true;
                            activeHint = "Did you mean <strong>'off'</strong> (with two f's)?";
                        }

                        // Rule I: Run-On Sentences & Missing Clause Breaks
                        if (clauseSubjectIndices.has(idx)) {
                            hasGrammarError = true;
                            activeHint = "Looks like a new sentence starts here! Put a full stop (.) before '" + token + "'.";
                        } else if (runOnIndices.has(idx)) {
                            hasGrammarError = true;
                            activeHint = "Long sentence! Try splitting it into two shorter sentences with a full stop (.)";
                        }

                        // Rule J: Missing Sentence Ending Punctuation
                        let isLastWord = true;
                        for (let j = idx + 1; j < tokens.length; j++) {
                            if (!/^[.,!?"']$/.test(tokens[j])) {
                                isLastWord = false;
                                break;
                            }
                        }
                        if (isLastWord) {
                            const lastTokenOverall = tokens[tokens.length - 1];
                            if (!/[.!?]/.test(lastTokenOverall)) {
                                hasGrammarError = true;
                                activeHint = "Remember a full stop (.), question mark (?), or exclamation mark (!) at the end!";
                            }
                        }

                        if (hasGrammarError) {
                            span.classList.add('grammar-error');
                        }

                        span.innerText = token;
                        span.onclick = () => { if (isEditMode) setActiveTarget(span); };
                        
                        bindWordHoverEvents(span, token, activeHint);
                    }

                    sentenceBox.appendChild(span);
                    sentenceBox.appendChild(createGapSpan()); 
                }
            }

            function generateApproximations(baseWord) {
                const shortWordDb = { 
                    'i': ['i', 'eye', 'a'], 
                    'a': ['a', 'uh', 'ey'], 
                    'my': ['my', 'me', 'mai'], 
                    'me': ['me', 'my', 'may'], 
                    'is': ['is', 'his', 'as'], 
                    'it': ['it', 'at', 'if'], 
                    'the': ['the', 'they', 'a'], 
                    'we': ['we', 'wee', 'way'] 
                };
                if (shortWordDb[baseWord.toLowerCase()]) return shortWordDb[baseWord.toLowerCase()].filter(w => !isBadWord(w));
                
                const phonetics = { 'th': ['f', 'v', 's'], 'r': ['w', 'l'], 'l': ['w', 'y'], 's': ['z', 'sh'], 'c': ['k', 's'], 'k': ['g', 'c'], 'p': ['b'], 't': ['d'] };
                let choices = new Set([baseWord]);
                
                for (let key in phonetics) {
                    if (baseWord.includes(key)) {
                        phonetics[key].forEach(rep => { if (choices.size < 3) choices.add(baseWord.replace(key, rep)); });
                    }
                }
                if (choices.size < 3 && baseWord.length > 3) choices.add(baseWord.slice(0, -1));
                if (choices.size < 3) choices.add(baseWord + "e");
                
                const simpleFallbacks = ['my', 'a', 'i', 'the', 'is', 'it', 'we'];
                let fallbackIdx = 0;
                while (choices.size < 3 && fallbackIdx < simpleFallbacks.length) {
                    if (simpleFallbacks[fallbackIdx] !== baseWord) choices.add(simpleFallbacks[fallbackIdx]);
                    fallbackIdx++;
                }
                return Array.from(choices).filter(w => !isBadWord(w)).slice(0, 3);
            }

            function shouldCapitalizeNext() {
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl) {
                        let prev = activeEl.previousElementSibling;
                        while (prev && prev.classList.contains('child-gap')) { prev = prev.previousElementSibling; }
                        if (!prev) return true; 
                        if (prev.classList.contains('child-punct') && /[.!?]/.test(prev.innerText)) { return true; }
                        return false;
                    }
                }
                
                let text = getCurrentText().trim();
                if (text.length === 0) return true; 
                let lastChar = text.slice(-1);
                return /[.!?]/.test(lastChar); 
            }

                }
            });

            const savedText = localStorage.getItem('saved_voice_writer_text');
            if (savedText) {
                updateSentenceText(savedText);
            }

            listenBtn.addEventListener('click', () => {
                warmUpMicrophoneHardware();
                if (!isListeningActive) {
                    startListeningCycle();
                }
            });

            stopBtn.addEventListener('click', () => {
                stopListeningCycle();
                statusText.innerText = "Stopped.";
            });

            function startListeningCycle() {
                isAutoListening = true;
                if (!isListeningActive) {
                    try { recognition.start(); } catch (e) { console.error(e); }
                }
            }

            function stopListeningCycle() {
                isAutoListening = false;
                clearTimeout(restartTimer);
                try { recognition.stop(); } catch (e) {}
            }

            recognition.onstart = () => {
                isListeningActive = true;
                statusText.innerText = "🎙️ Listening... speak now!";
                document.body.style.backgroundColor = isHighContrast ? "#1a0000" : "#ffebee";
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    statusText.innerText = "Didn't hear anything. Try again.";
                } else if (event.error !== 'aborted') {
                    statusText.innerText = "Microphone error: " + event.error;
                }
                isListeningActive = false;
                scheduleRestart();
            };

            recognition.onend = () => {
                isListeningActive = false;
                document.body.style.backgroundColor = isHighContrast ? "#121212" : "#e0f7fa";
                scheduleRestart();
            };

            function scheduleRestart() {
                if (isAutoListening) {
                    statusText.innerText = "Thinking...";
                    clearTimeout(restartTimer);
                    restartTimer = setTimeout(() => {
                        if (isAutoListening && !isListeningActive) {
                            try { recognition.start(); } catch (e) { }
                        }
                    }, 500); 
                } else {
                    document.body.style.backgroundColor = isHighContrast ? "#121212" : "#e0f7fa";
                }
            }

            recognition.onresult = (event) => {
                const resultCount = event.results.length;
                if (resultCount === 0) return;
                
                const alternatives = event.results[resultCount - 1];
                let bestPhrase = alternatives[0].transcript.trim().toLowerCase();
                if (!bestPhrase) return;

                const phraseWords = bestPhrase.split(/\s+/);
                phraseQueue = [];
                
                let capNext = shouldCapitalizeNext();
                
                for (let i = 0; i < phraseWords.length; i++) {
                    let rawWord = phraseWords[i];
                    let wordOptions = new Set();
                    
                    const cleanRaw = rawWord.replace(/[^a-z0-9]/g, '');
                    
                    if (['to', 'two', 'too', '2'].includes(cleanRaw)) {
                        wordOptions.add('to');
                        wordOptions.add('two');
                        wordOptions.add('too');
                    } else if (['we', 'wee', 'way', 'whey', 'v', 'oui'].includes(cleanRaw)) {
                        wordOptions.add('we');
                        wordOptions.add('wee');
                        wordOptions.add('way');
                    } else {
                        for (let altIndex = 0; altIndex < alternatives.length; altIndex++) {
                            const altTranscript = alternatives[altIndex].transcript.trim().toLowerCase();
                            const altWords = altTranscript.split(/\s+/);
                            if (altWords.length === phraseWords.length) {
                                let candidate = altWords[i];
                                if (!isBadWord(candidate)) {
                                    wordOptions.add(candidate);
                                }
                            }
                        }
                        
                        if (wordOptions.size === 0 && !isBadWord(rawWord)) {
                            wordOptions.add(rawWord);
                        }
                    }
                    
                    let optionsArray = Array.from(wordOptions);
                    
                    if (optionsArray.length > 0 && optionsArray.length < 3) {
                        const approx = generateApproximations(optionsArray[0]);
                        approx.forEach(w => { 
                            if(optionsArray.length < 3 && !optionsArray.includes(w)) {
                                optionsArray.push(w); 
                            }
                        });
                    }

                    if (optionsArray.length === 0) {
                        optionsArray.push("***");
                    }
                    
                    if (i === 0 && capNext) {
                        optionsArray = optionsArray.map(w => w.charAt(0).toUpperCase() + w.slice(1));
                    }
                    
                    optionsArray = shuffleArray(optionsArray.slice(0, 3));
                    phraseQueue.push(optionsArray);
                }

                if (phraseQueue.length > 0) {
                    displayOptions(phraseQueue[0]);
                    stopListeningCycle(); 
                }
            };

            function displayOptions(options) {
                optionsContainer.innerHTML = '';
                statusText.innerText = `Which word? (${phraseQueue.length} remaining)`;
                
                options.forEach(optionText => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = optionText;
                    btn.onclick = () => {
                        saveStateToHistory();
                        insertText(optionText);
                        optionsContainer.innerHTML = '';
                        
                        phraseQueue.shift();
                        if (phraseQueue.length > 0) {
                            displayOptions(phraseQueue[0]);
                        } else {
                            statusText.innerText = "Great! Ready for more.";
                            setTimeout(() => { startListeningCycle(); }, 600);
                        }
                    };
                    optionsContainer.appendChild(btn);
                });

                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'option-btn cancel-option-btn';
                cancelBtn.innerText = "❌ None (Try Again)";
                cancelBtn.onclick = () => {
                    optionsContainer.innerHTML = '';
                    phraseQueue = []; 
                    statusText.innerText = "Options cleared. Say the word again!";
                };
                optionsContainer.appendChild(cancelBtn);
            }

            function insertText(newWords) {
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl) {
                        if (activeEl.classList.contains('child-gap')) {
                            let wordsArr = newWords.split(' ');
                            let nextEl = activeEl.nextSibling;
                            wordsArr.forEach(w => {
                                let wSpan = document.createElement('span');
                                wSpan.className = 'child-word';
                                wSpan.innerText = w;
                                wSpan.onclick = () => { if (isEditMode) setActiveTarget(wSpan); };
                                bindWordHoverEvents(wSpan, w, "");
                                
                                let newGap = createGapSpan();
                                sentenceBox.insertBefore(wSpan, nextEl);
                                sentenceBox.insertBefore(newGap, nextEl);
                            });
                            activeEl.classList.remove('active-child-target');
                        } else if (activeEl.classList.contains('child-word') || activeEl.classList.contains('child-punct')) {
                            activeEl.className = 'child-word';
                            activeEl.innerText = newWords;
                            activeEl.classList.remove('active-child-target');
                            
                            let newSpan = activeEl.cloneNode(true);
                            newSpan.onclick = () => { if (isEditMode) setActiveTarget(newSpan); };
                            bindWordHoverEvents(newSpan, newWords, "");
                            activeEl.parentNode.replaceChild(newSpan, activeEl);
                        }
                        renderChildSpans(getCurrentText());
                        return;
                    }
                } else if (isTeacherMode) {
                    sentenceBox.focus();
                    let selection = window.getSelection();
                    if (selection.rangeCount > 0 && sentenceBox.contains(selection.anchorNode)) {
                        let range = selection.getRangeAt(0);
                        range.deleteContents();
                        let textNode = document.createTextNode(" " + newWords);
                        range.insertNode(textNode);
                        range.setStartAfter(textNode);
                        range.setEndAfter(textNode);
                        selection.removeAllRanges();
                        selection.addRange(range);
                        localStorage.setItem('saved_voice_writer_text', getCurrentText());
                        return;
                    }
                }

                let currentText = getCurrentText();
                if (currentText.length > 0 && !currentText.endsWith(' ')) { currentText += " "; }
                currentText += newWords;
                updateSentenceText(currentText);
            }

            function addPunctuation(mark) {
                saveStateToHistory();
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl) {
                        if (activeEl.classList.contains('child-gap')) {
                            let pSpan = document.createElement('span');
                            pSpan.className = 'child-punct';
                            pSpan.innerText = mark;
                            pSpan.onclick = () => { if (isEditMode) setActiveTarget(pSpan); };
                            sentenceBox.insertBefore(pSpan, activeEl.nextSibling);
                            activeEl.classList.remove('active-child-target');
                        } else if (activeEl.classList.contains('child-word') || activeEl.classList.contains('child-punct')) {
                            activeEl.className = 'child-punct';
                            activeEl.innerText = mark;
                            activeEl.classList.remove('active-child-target');
                        }
                        renderChildSpans(getCurrentText());
                        return;
                    }
                } else if (isTeacherMode) {
                    sentenceBox.focus();
                    let selection = window.getSelection();
                    if (selection.rangeCount > 0 && sentenceBox.contains(selection.anchorNode)) {
                        let range = selection.getRangeAt(0);
                        range.deleteContents();
                        let textNode = document.createTextNode(mark);
                        range.insertNode(textNode);
                        range.setStartAfter(textNode);
                        range.setEndAfter(textNode);
                        selection.removeAllRanges();
                        selection.addRange(range);
                        localStorage.setItem('saved_voice_writer_text', getCurrentText());
                        return;
                    }
                }
                
                let currentText = getCurrentText();
                currentText = currentText.trimEnd() + mark;
                updateSentenceText(currentText);
            }

            document.getElementById('comma-btn').onclick = () => addPunctuation(',');
            document.getElementById('period-btn').onclick = () => addPunctuation('.');
            document.getElementById('question-btn').onclick = () => addPunctuation('?');
            document.getElementById('exclamation-btn').onclick = () => addPunctuation('!');
            document.getElementById('quote-btn').onclick = () => addPunctuation('"');

            document.getElementById('delete-btn').addEventListener('click', () => {
                saveStateToHistory();
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl) {
                        if (!activeEl.classList.contains('child-gap')) {
                            let prev = activeEl.previousSibling;
                            if (prev && prev.classList.contains('child-gap')) prev.remove();
                            activeEl.remove();
                            renderChildSpans(getCurrentText());
                        }
                    } else {
                        let nodes = Array.from(sentenceBox.childNodes);
                        let i = nodes.length - 1;
                        while (i >= 0 && (!nodes[i].classList || nodes[i].classList.contains('child-gap'))) { i--; }
                        if (i >= 0) {
                            if (nodes[i].previousSibling) nodes[i].previousSibling.remove();
                            nodes[i].remove();
                            renderChildSpans(getCurrentText());
                        }
                    }
                } else if (isTeacherMode) {
                    sentenceBox.focus();
                    document.execCommand('delete', false, null);
                    localStorage.setItem('saved_voice_writer_text', getCurrentText());
                } else {
                    let currentText = getCurrentText();
                    let lastSpaceIndex = currentText.lastIndexOf(' ');
                    if (lastSpaceIndex !== -1) {
                        currentText = currentText.substring(0, lastSpaceIndex).trim();
                    } else {
                        currentText = "";
                    }
                    updateSentenceText(currentText);
                }
            });

            capitalizeBtn.addEventListener('click', () => {
                if (isEditMode) {
                    let activeEl = document.querySelector('.active-child-target');
                    if (activeEl && activeEl.classList.contains('child-word')) {
                        saveStateToHistory();
                        let text = activeEl.innerText;
                        let firstChar = text.charAt(0);
                        if (firstChar === firstChar.toUpperCase()) {
                            activeEl.innerText = firstChar.toLowerCase() + text.slice(1);
                        } else {
                            activeEl.innerText = firstChar.toUpperCase() + text.slice(1);
                        }
                        renderChildSpans(getCurrentText());
                    } else {
                        statusText.innerText = "Tap a word to capitalize it first.";
                    }
                }
            });

            document.getElementById('undo-action-btn').addEventListener('click', () => {
                if (textHistory.length > 0) {
                    let previousState = textHistory.pop();
                    updateSentenceText(previousState);
                    statusText.innerText = "Undone!";
                } else {
                    statusText.innerText = "Nothing to undo.";
                }
            });

            const clearModal = document.getElementById('clear-modal');
            const confirmClearBtn = document.getElementById('confirm-clear-btn');
            const cancelClearBtn = document.getElementById('cancel-clear-btn');
            const restoreBtn = document.getElementById('restore-btn');

            document.getElementById('clear-btn').addEventListener('click', () => {
                clearModal.style.display = 'flex';
            });

            cancelClearBtn.addEventListener('click', () => { clearModal.style.display = 'none'; });

            confirmClearBtn.addEventListener('click', () => {
                backupText = getCurrentText();
                updateSentenceText("");
                textHistory = [];
                restoreBtn.style.display = 'inline-block';
                clearModal.style.display = 'none';
                statusText.innerText = "Cleared. You can click 'Restore' if it was an accident.";
            });

            restoreBtn.addEventListener('click', () => {
                updateSentenceText(backupText);
                restoreBtn.style.display = 'none';
                statusText.innerText = "Text restored!";
            });

            document.getElementById('copy-btn').addEventListener('click', () => {
                let text = getCurrentText();
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        statusText.innerText = "Text Copied!";
                    });
                } else {
                    let tempArea = document.createElement("textarea");
                    tempArea.value = text;
                    document.body.appendChild(tempArea);
                    tempArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempArea);
                    statusText.innerText = "Text Copied!";
                }
            });

            document.getElementById('print-btn').addEventListener('click', () => {
                let text = getCurrentText();
                if (!text.trim()) {
                    statusText.innerText = "Nothing to print!";
                    return;
                }
                sentenceBox.innerText = text;
                window.print();
                updateSentenceText(text); 
            });

            document.getElementById('read-sentence-btn').addEventListener('click', () => {
                warmUpMicrophoneHardware();
                let textToRead = getCurrentText();
                if (textToRead) {
                    speakTextNaturally(textToRead, 0.9);
                } else {
                    statusText.innerText = "There is no text to read.";
                }
            });
            
            updateModes(); 
        }
    </script>
</body>
</html>
