<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Choice Writer</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 15px;
            margin: 0;
            color: #222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        h1 { 
            color: #00796b; 
            margin: 0 0 10px 0;
            font-size: clamp(22px, 3.5vw, 30px);
            flex-shrink: 0;
        }

        /* Two-Column App Layout */
        .app-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            flex-grow: 1;
            height: calc(100% - 50px);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        /* Left Column: Scrollable Text Box */
        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #sentence-box {
            background: white;
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            height: 100%;
            padding: 20px;
            font-size: clamp(22px, 3.5vw, 32px);
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Right Column: Controls and Options */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            justify-content: flex-start;
        }

        .controls-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            font-family: inherit;
            font-size: clamp(16px, 2vw, 20px);
            padding: 10px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px #777;
        }
        
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0px #777;
        }

        #listen-btn { background-color: #2e7d32; color: #ffffff; box-shadow: 0 4px #1b5e20; font-weight: bold; }
        #stop-btn { background-color: #c2185b; color: #ffffff; box-shadow: 0 4px #880e4f; font-weight: bold; }
        
        /* High-Contrast Dyslexia-Friendly Punctuation Styling */
        .punct-btn { 
            background-color: #1a237e; 
            color: #ffffff; 
            box-shadow: 0 4px #0d47a1; 
            font-size: 26px;
            font-weight: 900;
            min-width: 52px;
            border: 2px solid #000000;
        }
        
        .action-btn { background-color: #0277bd; color: #ffffff; box-shadow: 0 4px #01579b; }
        #undo-btn { background-color: #e65100; color: #ffffff; box-shadow: 0 4px #bf360c; font-weight: bold; }
        #clear-btn { background-color: #d32f2f; color: #ffffff; box-shadow: 0 4px #b71c1c; }
        #restore-btn { background-color: #00897b; color: #ffffff; box-shadow: 0 4px #004d40; font-weight: bold; display: none; }
        #read-sentence-btn { background-color: #6a1b9a; color: #ffffff; box-shadow: 0 4px #4a148c; }
        
        #options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
            flex-grow: 1;
            justify-content: center;
        }

        .option-btn {
            background-color: #6a1b9a;
            color: #ffffff;
            box-shadow: 0 4px #4a148c;
            font-size: clamp(22px, 3.5vw, 32px);
            padding: 15px;
            width: 100%;
            animation: popIn 0.3s ease-out;
            word-wrap: break-word;
        }

        #status {
            font-size: clamp(16px, 2vw, 19px);
            color: #222222;
            font-weight: bold;
            min-height: 28px;
            margin: 5px 0;
        }

        /* Confirmation Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #d32f2f;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            animation: popIn 0.2s ease-out;
        }

        .modal-box h2 {
            margin-top: 0;
            color: #d32f2f;
            font-size: 28px;
        }

        .modal-box p {
            font-size: 20px;
            color: #333;
            margin-bottom: 25px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        #confirm-clear-btn {
            background-color: #d32f2f;
            color: white;
            box-shadow: 0 4px #b71c1c;
            font-weight: bold;
        }

        #cancel-clear-btn {
            background-color: #757575;
            color: white;
            box-shadow: 0 4px #424242;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 650px) {
            .app-container {
                flex-direction: column;
            }
            .left-panel {
                height: 40%;
            }
            #options-container {
                flex-direction: row;
            }
            .option-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <h1>🎙️ Voice Choice Writer ✍️</h1>
    
    <div class="app-container">
        <!-- LEFT: Scrollable Sentence Box -->
        <div class="left-panel">
            <div id="sentence-box"></div>
        </div>

        <!-- RIGHT: Controls and Choices -->
        <div class="right-panel">
            <!-- Listening Controls -->
            <div class="controls-group">
                <button id="listen-btn">🎤 Start Listening</button>
                <button id="stop-btn">🛑 Stop Listening</button>
            </div>

            <!-- High Contrast Punctuation Buttons -->
            <div class="controls-group">
                <button id="comma-btn" class="punct-btn">,</button>
                <button id="period-btn" class="punct-btn">.</button>
                <button id="question-btn" class="punct-btn">?</button>
                <button id="exclamation-btn" class="punct-btn">!</button>
            </div>

            <!-- Action Controls -->
            <div class="controls-group">
                <button id="read-sentence-btn">🔊 Read Sentence</button>
                <button id="undo-btn">⌫ Delete Word</button>
                <button id="copy-btn" class="action-btn">📋 Copy to Docs</button>
                <button id="clear-btn">🗑️ Clear</button>
                <button id="restore-btn">↩️ Restore Text</button>
            </div>

            <div id="status">Click "Start Listening" when ready!</div>
            
            <!-- Word Choices Output -->
            <div id="options-container"></div>
        </div>
    </div>

    <!-- Confirmation Modal Dialog -->
    <div id="clear-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>⚠️ Are you sure?</h2>
            <p>Do you really want to clear all your writing?</p>
            <div class="modal-buttons">
                <button id="confirm-clear-btn">Yes, Clear</button>
                <button id="cancel-clear-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isAutoListening = false;
        let isListeningActive = false;
        let restartTimer = null;
        
        let phraseQueue = [];
        let backupText = ""; // Holds restored text safety net

        if (!SpeechRecognition) {
            document.getElementById('status').innerText = "Oops! Your browser doesn't support voice typing. Try Google Chrome!";
        } else {
            recognition = new SpeechRecognition();
            recognition.maxAlternatives = 3; 
            recognition.continuous = false; 
            recognition.interimResults = false;
            recognition.lang = 'en-GB';

            const listenBtn = document.getElementById('listen-btn');
            const stopBtn = document.getElementById('stop-btn');
            const commaBtn = document.getElementById('comma-btn');
            const periodBtn = document.getElementById('period-btn');
            const questionBtn = document.getElementById('question-btn');
            const exclamationBtn = document.getElementById('exclamation-btn');
            const copyBtn = document.getElementById('copy-btn');
            const undoBtn = document.getElementById('undo-btn');
            const clearBtn = document.getElementById('clear-btn');
            const restoreBtn = document.getElementById('restore-btn');
            const readSentenceBtn = document.getElementById('read-sentence-btn');
            const sentenceBox = document.getElementById('sentence-box');
            const optionsContainer = document.getElementById('options-container');
            const statusText = document.getElementById('status');
            
            const clearModal = document.getElementById('clear-modal');
            const confirmClearBtn = document.getElementById('confirm-clear-btn');
            const cancelClearBtn = document.getElementById('cancel-clear-btn');

            function safeStartListen() {
                if (!isAutoListening) return;
                clearTimeout(restartTimer);

                if (phraseQueue.length > 0) {
                    processNextWordInQueue();
                    return;
                }

                if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                    statusText.innerText = "Waiting for audio to finish...";
                    restartTimer = setTimeout(safeStartListen, 300);
                    return;
                }

                if (isListeningActive) return;

                try {
                    recognition.start();
                } catch (e) {
                    restartTimer = setTimeout(safeStartListen, 300);
                }
            }

            function stopAllListening() {
                isAutoListening = false;
                isListeningActive = false;
                phraseQueue = [];
                clearTimeout(restartTimer);
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                try {
                    recognition.stop();
                } catch (e) {}
                stopListeningUI();
            }

            function stopListeningUI() {
                listenBtn.style.backgroundColor = "#2e7d32";
                listenBtn.style.color = "#ffffff";
                listenBtn.innerText = "🎤 Start Listening";
            }

            function updateListeningUI() {
                listenBtn.style.backgroundColor = "#fbc02d"; 
                listenBtn.style.color = "#000000";
                listenBtn.innerText = "🔴 Listening Active";
            }

            function addPunctuation(mark) {
                let text = sentenceBox.textContent;
                if (text.endsWith(' ')) {
                    text = text.slice(0, -1);
                }
                sentenceBox.textContent = text + mark + ' ';
                sentenceBox.scrollTop = sentenceBox.scrollHeight;
            }

            function speakText(text, callback) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.85; 
                    if (callback) {
                        utterance.onend = callback;
                        utterance.onerror = callback;
                    }
                    window.speechSynthesis.speak(utterance);
                } else if (callback) {
                    callback();
                }
            }

            function processNextWordInQueue() {
                if (phraseQueue.length === 0) {
                    if (isAutoListening) {
                        statusText.innerText = "Phrase finished! Mic starting...";
                        restartTimer = setTimeout(safeStartListen, 400);
                    }
                    return;
                }

                const wordOptions = phraseQueue.shift();
                optionsContainer.innerHTML = ''; 
                statusText.innerText = `Pick word (${phraseQueue.length + 1} remaining): 👇`;

                wordOptions.forEach(word => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = word;
                    
                    btn.onmouseenter = () => {
                        if (!isListeningActive) speakText(word);
                    };

                    btn.onclick = () => {
                        let formattedWord = word;
                        const currentText = sentenceBox.textContent;
                        if (currentText.length === 0 || /[.!?]\s*$/.test(currentText)) {
                            formattedWord = formattedWord.charAt(0).toUpperCase() + formattedWord.slice(1);
                        }
                        
                        sentenceBox.textContent += formattedWord + ' ';
                        sentenceBox.scrollTop = sentenceBox.scrollHeight;
                        optionsContainer.innerHTML = '';
                        
                        setTimeout(processNextWordInQueue, 250);
                    };

                    optionsContainer.appendChild(btn);
                });
            }

            // --- BUTTON HANDLERS --- //

            listenBtn.addEventListener('click', () => {
                optionsContainer.innerHTML = '';
                phraseQueue = [];
                isAutoListening = true;
                safeStartListen();
            });

            stopBtn.addEventListener('click', () => {
                stopAllListening();
                statusText.innerText = "Listening stopped. Click Start when ready.";
                optionsContainer.innerHTML = '';
            });

            commaBtn.addEventListener('click', () => {
                addPunctuation(',');
                if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300);
            });

            periodBtn.addEventListener('click', () => {
                addPunctuation('.');
                if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300);
            });

            questionBtn.addEventListener('click', () => {
                addPunctuation('?');
                if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300);
            });

            exclamationBtn.addEventListener('click', () => {
                addPunctuation('!');
                if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300);
            });

            undoBtn.addEventListener('click', () => {
                let text = sentenceBox.textContent.trimEnd();
                if (text) {
                    let words = text.split(/\s+/);
                    words.pop();
                    sentenceBox.textContent = words.length > 0 ? words.join(' ') + ' ' : '';
                    statusText.innerText = "Last word removed.";
                }
            });

            copyBtn.addEventListener('click', () => {
                const text = sentenceBox.textContent.trim();
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        const originalText = copyBtn.innerText;
                        copyBtn.innerText = "✅ Copied!";
                        setTimeout(() => copyBtn.innerText = originalText, 2500);
                    });
                }
            });

            // Open Confirmation Modal
            clearBtn.addEventListener('click', () => {
                if (sentenceBox.textContent.trim().length > 0) {
                    clearModal.style.display = 'flex';
                }
            });

            // Confirm Clear Execution
            confirmClearBtn.addEventListener('click', () => {
                backupText = sentenceBox.textContent; // Save safety net backup
                sentenceBox.textContent = '';
                optionsContainer.innerHTML = '';
                stopAllListening();
                clearModal.style.display = 'none';
                restoreBtn.style.display = 'inline-block'; // Show restore button
                statusText.innerText = "Cleared. Use 'Restore Text' if this was a mistake.";
            });

            // Cancel Clear Execution
            cancelClearBtn.addEventListener('click', () => {
                clearModal.style.display = 'none';
            });

            // Restore Backed-Up Text
            restoreBtn.addEventListener('click', () => {
                if (backupText) {
                    sentenceBox.textContent = backupText;
                    restoreBtn.style.display = 'none'; // Hide after restoring
                    statusText.innerText = "Text restored!";
                }
            });

            readSentenceBtn.addEventListener('click', () => {
                const text = sentenceBox.textContent.trim();
                if (text) {
                    const wasAuto = isAutoListening;
                    isAutoListening = false;
                    try { recognition.stop(); } catch(e){}
                    
                    speakText(text, () => {
                        if (wasAuto) {
                            isAutoListening = true;
                            safeStartListen();
                        }
                    });
                }
            });

            // --- RECOGNITION EVENTS --- //

            recognition.onstart = () => {
                isListeningActive = true;
                updateListeningUI();
                statusText.innerText = "🔴 Listening... Speak now! 👂";
            };

            recognition.onresult = (event) => {
                const results = event.results[0];
                optionsContainer.innerHTML = ''; 
                phraseQueue = [];

                let wordsByPosition = [];

                for (let i = 0; i < results.length; i++) {
                    let transcript = results[i].transcript.trim().toLowerCase();
                    transcript = transcript.replace(/[.,!?]/g, ''); 
                    let words = transcript.split(/\s+/).filter(w => w.length > 0);

                    words.forEach((w, pos) => {
                        if (!wordsByPosition[pos]) {
                            wordsByPosition[pos] = new Set();
                        }
                        wordsByPosition[pos].add(w);
                    });
                }

                phraseQueue = wordsByPosition.map(set => Array.from(set).slice(0, 3)).filter(arr => arr.length > 0);

                if (phraseQueue.length > 0) {
                    processNextWordInQueue();
                } else {
                    statusText.innerText = "Didn't catch that. Trying again...";
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 600);
                    }
                }
            };

            recognition.onerror = (event) => {
                isListeningActive = false;
                if (event.error === 'no-speech') {
                    statusText.innerText = "No speech detected. Listening again...";
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 400);
                    }
                } else if (event.error === 'aborted') {
                    // Intentionally stopped
                } else {
                    statusText.innerText = "Mic status: " + event.error;
                    if (isAutoListening) {
                        restartTimer = setTimeout(safeStartListen, 800);
                    }
                }
            };

            recognition.onend = () => {
                isListeningActive = false;
                if (phraseQueue.length > 0) {
                    processNextWordInQueue();
                } else if (isAutoListening) {
                    restartTimer = setTimeout(safeStartListen, 300);
                } else {
                    stopListeningUI();
                }
            };
        }
    </script>
</body>
</html>
