<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Choice Writer</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            padding: 12px;
            margin: 0;
            color: #222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        h1 { 
            color: #00796b; 
            margin: 0 0 8px 0;
            font-size: clamp(20px, 3vw, 26px);
            flex-shrink: 0;
        }

        .app-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            flex-grow: 1;
            height: calc(100% - 40px);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        .left-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 6px;
        }

        .edit-header {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            background: #b2dfdb;
            padding: 6px 12px;
            border-radius: 10px;
            border: 2px solid #00796b;
        }

        .mode-btn {
            background-color: #00796b;
            color: white;
            font-weight: bold;
            box-shadow: 0 3px #004d40;
            padding: 6px 14px;
            flex: 1;
        }

        #sentence-box {
            background: white;
            border: 4px dashed #00bcd4;
            border-radius: 15px;
            flex-grow: 1;
            padding: 18px;
            font-size: clamp(22px, 3.2vw, 30px);
            text-align: left;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            outline: none;
            transition: all 0.3s ease;
        }

        /* CHILD EDIT MODE STYLES */
        #sentence-box.child-edit-active {
            border: 4px solid #ff9800 !important;
            background-color: #fff8e1 !important;
            white-space: normal; /* Better for dynamic spans */
        }
        
        .child-gap {
            display: inline-block;
            width: 22px;
            height: 28px;
            margin: 0 2px;
            background-color: #e0f2f1;
            border-radius: 4px;
            cursor: pointer;
            vertical-align: middle;
            transition: background 0.2s;
        }
        .child-gap:hover { background-color: #b2dfdb; }
        
        .child-word {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .child-word:hover {
            background-color: #fff9c4;
            border-color: #fbc02d;
        }

        .active-child-target {
            background-color: #ffeb3b !important;
            border: 2px solid #f57f17 !important;
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 10;
        }

        /* TEACHER MODE STYLES */
        #sentence-box.teacher-edit-active {
            border: 4px solid #9c27b0 !important;
            background-color: #f3e5f5 !important;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
            justify-content: flex-start;
        }

        .controls-group {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            gap: 5px;
            width: 100%;
        }

        button {
            font-family: inherit;
            font-size: clamp(13px, 1.5vw, 16px);
            padding: 8px 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 3px #777;
            white-space: nowrap;
        }
        
        button:active {
            transform: translateY(3px);
            box-shadow: 0 0px #777;
        }

        #listen-btn { background-color: #2e7d32; color: #ffffff; box-shadow: 0 3px #1b5e20; font-weight: bold; flex: 1; }
        #stop-btn { background-color: #c2185b; color: #ffffff; box-shadow: 0 3px #880e4f; font-weight: bold; flex: 1; }
        
        .punct-btn { 
            background-color: #1a237e; 
            color: #ffffff; 
            box-shadow: 0 3px #0d47a1; 
            font-size: 22px;
            font-weight: 900;
            padding: 6px 14px;
            flex: 1;
            border: 2px solid #000000;
        }
        
        .action-btn { background-color: #0277bd; color: #ffffff; box-shadow: 0 3px #01579b; }
        #print-btn { background-color: #00796b; color: #ffffff; box-shadow: 0 3px #004d40; font-weight: bold; }
        #undo-btn { background-color: #e65100; color: #ffffff; box-shadow: 0 3px #bf360c; font-weight: bold; }
        #clear-btn { background-color: #d32f2f; color: #ffffff; box-shadow: 0 3px #b71c1c; }
        #restore-btn { background-color: #00897b; color: #ffffff; box-shadow: 0 3px #004d40; font-weight: bold; display: none; }
        #read-sentence-btn { background-color: #6a1b9a; color: #ffffff; box-shadow: 0 3px #4a148c; }
        
        #options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
            flex-grow: 1;
            justify-content: space-evenly;
        }

        .option-btn {
            background-color: #6a1b9a;
            color: #ffffff;
            box-shadow: 0 4px #4a148c;
            font-size: clamp(22px, 3.2vw, 30px);
            padding: 12px;
            width: 100%;
            animation: popIn 0.3s ease-out;
            word-wrap: break-word;
        }

        #status {
            font-size: clamp(14px, 1.8vw, 17px);
            color: #222222;
            font-weight: bold;
            min-height: 24px;
            margin: 2px 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 4px solid #d32f2f;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            animation: popIn 0.2s ease-out;
        }

        .modal-box h2 {
            margin-top: 0;
            color: #d32f2f;
            font-size: 26px;
        }
        
        .teacher-modal-box h2 { color: #9c27b0; }
        .teacher-modal-box { border-color: #9c27b0; }

        .modal-box p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        #confirm-clear-btn { background-color: #d32f2f; color: white; box-shadow: 0 3px #b71c1c; font-weight: bold; }
        #confirm-teacher-btn { background-color: #9c27b0; color: white; box-shadow: 0 3px #7b1fa2; font-weight: bold; }
        .cancel-btn { background-color: #757575; color: white; box-shadow: 0 3px #424242; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 650px) {
            .app-container { flex-direction: column; }
            .left-panel { height: 40%; }
            #options-container { flex-direction: row; }
            .option-btn { flex: 1; }
        }

        @media print {
            body { background-color: white !important; padding: 0 !important; margin: 0 !important; height: auto !important; overflow: visible !important; }
            h1, .right-panel, .edit-header, .modal-overlay, #status { display: none !important; }
            .app-container { display: block !important; max-width: 100% !important; height: auto !important; }
            .left-panel { width: 100% !important; height: auto !important; }
            #sentence-box {
                border: none !important; box-shadow: none !important; padding: 0 !important; font-size: 24pt !important; color: black !important;
                font-family: Arial, sans-serif !important; line-height: 1.6 !important; overflow: visible !important; white-space: pre-wrap !important;
            }
        }
    </style>
</head>
<body>

    <h1>🎙️ Voice Choice Writer ✍️</h1>
    
    <div class="app-container">
        <!-- LEFT: Scrollable Sentence Box & Edit Bar -->
        <div class="left-panel">
            <div class="edit-header">
                <button id="edit-toggle-btn" class="mode-btn">✏️ Edit Mode: OFF</button>
                <button id="teacher-toggle-btn" class="mode-btn">👩‍🏫 Teacher Mode: OFF</button>
            </div>
            <div id="sentence-box" contenteditable="false"></div>
        </div>

        <!-- RIGHT: Controls and Choices -->
        <div class="right-panel">
            <div class="controls-group">
                <button id="listen-btn">🎤 Start Listening</button>
                <button id="stop-btn">🛑 Stop Listening</button>
            </div>

            <div class="controls-group">
                <button id="comma-btn" class="punct-btn">,</button>
                <button id="period-btn" class="punct-btn">.</button>
                <button id="question-btn" class="punct-btn">?</button>
                <button id="exclamation-btn" class="punct-btn">!</button>
            </div>

            <div class="controls-group">
                <button id="read-sentence-btn">🔊 Read</button>
                <button id="undo-btn">⌫ Delete</button>
                <button id="copy-btn" class="action-btn">📋 Copy</button>
                <button id="print-btn">🖨️ Print</button>
                <button id="clear-btn">🗑️ Clear</button>
                <button id="restore-btn">↩️ Restore</button>
            </div>

            <div id="status">Click "Start Listening" when ready!</div>
            
            <div id="options-container"></div>
        </div>
    </div>

    <!-- CLEAR CONFIRMATION MODAL -->
    <div id="clear-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>⚠️ Are you sure?</h2>
            <p>Do you really want to clear all your writing?</p>
            <div class="modal-buttons">
                <button id="confirm-clear-btn">Yes, Clear</button>
                <button class="cancel-btn" id="cancel-clear-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- TEACHER MODE ADULT CHECK MODAL -->
    <div id="teacher-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box teacher-modal-box">
            <h2>👩‍🏫 Teacher Mode</h2>
            <p><strong>Warning!</strong> This unlocks the keyboard.<br>Only adults should use this mode.</p>
            <div class="modal-buttons">
                <button id="confirm-teacher-btn">Yes, I am an adult</button>
                <button class="cancel-btn" id="cancel-teacher-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isAutoListening = false;
        let isListeningActive = false;
        
        let isEditMode = false; // Child Edit Mode
        let isTeacherMode = false;

        let restartTimer = null;
        let audioCtx = null;
        
        let phraseQueue = [];
        let backupText = ""; 
        let savedCaretRange = null;

        const sentenceBox = document.getElementById('sentence-box');
        const statusText = document.getElementById('status');
        const optionsContainer = document.getElementById('options-container');
        
        const editToggleBtn = document.getElementById('edit-toggle-btn');
        const teacherToggleBtn = document.getElementById('teacher-toggle-btn');

        if (!SpeechRecognition) {
            statusText.innerText = "Oops! Your browser doesn't support voice typing. Try Google Chrome!";
        } else {
            recognition = new SpeechRecognition();
            recognition.maxAlternatives = 5; 
            recognition.continuous = false; 
            recognition.interimResults = false;
            recognition.lang = 'en-GB';

            const listenBtn = document.getElementById('listen-btn');
            const stopBtn = document.getElementById('stop-btn');

            function warmUpMicrophoneHardware() {
                try {
                    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                } catch (e) {}
            }

            // --- TEXT EXTRACTION HELPER --- //
            // Gets clean text regardless of whether spans are active or not
            function getCurrentText() {
                let text = sentenceBox.textContent || "";
                // Collapse multiple spaces into one, and fix spaces before punctuation
                return text.replace(/\s+/g, ' ').replace(/\s+([.,!?])/g, '$1').trim();
            }

            function updateSentenceText(newText) {
                if (isEditMode) {
                    renderChildSpans(newText);
                } else {
                    sentenceBox.textContent = newText;
                }
                localStorage.setItem('saved_voice_writer_text', newText);
            }

            // --- CHILD EDIT MODE SPANS LOGIC --- //
            function createGapSpan() {
                const gSpan = document.createElement('span');
                gSpan.className = 'child-gap';
                gSpan.textContent = ' '; 
                gSpan.onclick = () => setActiveTarget(gSpan);
                return gSpan;
            }

            function setActiveTarget(el) {
                document.querySelectorAll('.active-child-target').forEach(e => e.classList.remove('active-child-target'));
                el.classList.add('active-child-target');
            }

            function renderChildSpans(text) {
                // Clean the text string before breaking it into clickable spans
                let cleanText = text.replace(/\s+/g, ' ').replace(/\s+([.,!?])/g, '$1').trim();
                const words = cleanText.match(/\S+/g) || [];
                
                sentenceBox.innerHTML = '';
                sentenceBox.appendChild(createGapSpan()); // Always start with a gap
                
                words.forEach(word => {
                    const wSpan = document.createElement('span');
                    wSpan.className = 'child-word';
                    wSpan.innerText = word;
                    wSpan.onclick = () => setActiveTarget(wSpan);
                    sentenceBox.appendChild(wSpan);
                    
                    sentenceBox.appendChild(createGapSpan()); // Gap after every word
                });
            }

            // --- MODE TOGGLES --- //
            function updateModes() {
                const currentExtractedText = getCurrentText();

                if (isTeacherMode) {
                    sentenceBox.innerHTML = ''; // Clear spans
                    sentenceBox.textContent = currentExtractedText; // Put raw text back
                    
                    sentenceBox.contentEditable = "true";
                    sentenceBox.className = 'teacher-edit-active';
                    
                    teacherToggleBtn.innerText = "👩‍🏫 Teacher Mode: ON";
                    teacherToggleBtn.style.backgroundColor = "#9c27b0";
                    editToggleBtn.innerText = "✏️ Edit Mode: OFF";
                    editToggleBtn.style.backgroundColor = "#00796b";
                    
                    statusText.innerText = "Teacher Mode ON: Keyboard unlocked.";
                    sentenceBox.focus();
                } else if (isEditMode) {
                    sentenceBox.contentEditable = "false"; // Disable typing
                    sentenceBox.className = 'child-edit-active';
                    
                    renderChildSpans(currentExtractedText);
                    
                    editToggleBtn.innerText = "✏️ Edit Mode: ON";
                    editToggleBtn.style.backgroundColor = "#ff9800";
                    teacherToggleBtn.innerText = "👩‍🏫 Teacher Mode: OFF";
                    teacherToggleBtn.style.backgroundColor = "#00796b";
                    
                    statusText.innerText = "Edit Mode ON: Click a gap to add, or click a word to replace.";
                } else {
                    sentenceBox.innerHTML = ''; 
                    sentenceBox.textContent = currentExtractedText;
                    
                    sentenceBox.contentEditable = "false";
                    sentenceBox.className = '';
                    
                    editToggleBtn.innerText = "✏️ Edit Mode: OFF";
                    editToggleBtn.style.backgroundColor = "#00796b";
                    teacherToggleBtn.innerText = "👩‍🏫 Teacher Mode: OFF";
                    teacherToggleBtn.style.backgroundColor = "#00796b";
                    
                    statusText.innerText = "Voice Mode Active.";
                    savedCaretRange = null; 
                }
                localStorage.setItem('saved_voice_writer_text', currentExtractedText);
            }

            // Edit Mode (Child) Toggle
            editToggleBtn.addEventListener('click', () => {
                isEditMode = !isEditMode;
                isTeacherMode = false;
                updateModes();
            });

            // Teacher Mode Toggle & Modal
            const teacherModal = document.getElementById('teacher-modal');
            teacherToggleBtn.addEventListener('click', () => {
                if (isTeacherMode) {
                    isTeacherMode = false;
                    updateModes();
                } else {
                    teacherModal.style.display = 'flex';
                }
            });
            document.getElementById('confirm-teacher-btn').addEventListener('click', () => {
                teacherModal.style.display = 'none';
                isTeacherMode = true;
                isEditMode = false;
                updateModes();
            });
            document.getElementById('cancel-teacher-btn').addEventListener('click', () => {
                teacherModal.style.display = 'none';
            });

            // Tracking manual caret in Teacher Mode
            function saveCaretPosition() {
                if (isTeacherMode) {
                    const sel = window.getSelection();
                    if (sel.rangeCount > 0) {
                        savedCaretRange = sel.getRangeAt(0).cloneRange();
                    }
                }
            }
            sentenceBox.addEventListener('keyup', () => {
                if (isTeacherMode) {
                    saveCaretPosition();
                    localStorage.setItem('saved_voice_writer_text', getCurrentText());
                }
            });
            sentenceBox.addEventListener('click', saveCaretPosition);

            window.addEventListener('load', () => {
                const saved = localStorage.getItem('saved_voice_writer_text');
                if (saved && saved.trim().length > 0) {
                    sentenceBox.textContent = saved;
                    statusText.innerText = "Restored your previous work!";
                }
            });

            // --- INSERTION LOGIC --- //
            function insertTextAtCursor(textToInsert) {
                if (isTeacherMode) {
                    sentenceBox.focus();
                    const sel = window.getSelection();
                    if (savedCaretRange && sentenceBox.contains(savedCaretRange.commonAncestorContainer)) {
                        sel.removeAllRanges();
                        sel.addRange(savedCaretRange);
                        const range = sel.getRangeAt(0);
                        range.deleteContents();
                        const textNode = document.createTextNode(textToInsert);
                        range.insertNode(textNode);
                        range.setStartAfter(textNode);
                        range.setEndAfter(textNode);
                        sel.removeAllRanges();
                        sel.addRange(range);
                        savedCaretRange = range.cloneRange();
                    } else {
                        sentenceBox.textContent += textToInsert;
                    }
                } 
                else if (isEditMode) {
                    const activeEl = document.querySelector('.active-child-target');
                    if (activeEl) {
                        if (activeEl.classList.contains('child-word')) {
                            // Replace highlighted word
                            activeEl.innerText = textToInsert.trim();
                        } else if (activeEl.classList.contains('child-gap')) {
                            // Insert before the gap WITH a space on both sides
                            activeEl.insertAdjacentText('beforebegin', " " + textToInsert.trim() + " ");
                        }
                    } else {
                        // Append if nothing highlighted
                        sentenceBox.insertAdjacentText('beforeend', " " + textToInsert.trim());
                    }
                    // Clean and re-render the spans automatically!
                    renderChildSpans(getCurrentText());
                } 
                else {
                    // Standard Voice Mode Append
                    let text = sentenceBox.textContent;
                    if (text.length > 0 && !text.endsWith(' ') && textToInsert.trim().length > 0 && !/[.,!?]/.test(textToInsert)) {
                        text += ' '; 
                    }
                    sentenceBox.textContent = text + textToInsert;
                    sentenceBox.scrollTop = sentenceBox.scrollHeight;
                }
                
                localStorage.setItem('saved_voice_writer_text', getCurrentText());
            }

            function generateApproximations(baseWord) {
                const shortWordDb = { 'i': ['i', 'eye', 'a'], 'a': ['a', 'uh', 'ey'], 'my': ['my', 'me', 'mai'], 'me': ['me', 'my', 'may'], 'is': ['is', 'his', 'as'], 'it': ['it', 'at', 'if'], 'the': ['the', 'they', 'a'], 'to': ['to', 'two', 'too'] };
                if (shortWordDb[baseWord.toLowerCase()]) return shortWordDb[baseWord.toLowerCase()];
                const phonetics = { 'th': ['f', 'v', 's'], 'r': ['w', 'l'], 'l': ['w', 'y'], 's': ['z', 'sh'], 'c': ['k', 's'], 'k': ['g', 'c'], 'p': ['b'], 't': ['d'] };
                let choices = new Set([baseWord]);
                for (let key in phonetics) {
                    if (baseWord.includes(key)) {
                        phonetics[key].forEach(rep => { if (choices.size < 3) choices.add(baseWord.replace(key, rep)); });
                    }
                }
                if (choices.size < 3 && baseWord.length > 3) choices.add(baseWord.slice(0, -1));
                if (choices.size < 3) choices.add(baseWord + "e");
                const simpleFallbacks = ['my', 'a', 'i', 'the', 'is', 'it', 'to'];
                let fallbackIdx = 0;
                while (choices.size < 3 && fallbackIdx < simpleFallbacks.length) {
                    if (simpleFallbacks[fallbackIdx] !== baseWord) choices.add(simpleFallbacks[fallbackIdx]);
                    fallbackIdx++;
                }
                return Array.from(choices).slice(0, 3);
            }

            function safeStartListen() {
                if (!isAutoListening) return;
                clearTimeout(restartTimer);
                warmUpMicrophoneHardware();
                if (phraseQueue.length > 0) { processNextWordInQueue(); return; }
                if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                    statusText.innerText = "Waiting for audio to finish...";
                    restartTimer = setTimeout(safeStartListen, 350);
                    return;
                }
                if (isListeningActive) return;
                try { recognition.start(); } catch (e) { restartTimer = setTimeout(safeStartListen, 350); }
            }

            function stopAllListening() {
                isAutoListening = false;
                isListeningActive = false;
                phraseQueue = [];
                clearTimeout(restartTimer);
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                try { recognition.stop(); } catch (e) {}
                stopListeningUI();
            }

            function stopListeningUI() {
                listenBtn.style.backgroundColor = "#2e7d32";
                listenBtn.style.color = "#ffffff";
                listenBtn.innerText = "🎤 Start Listening";
            }

            function updateListeningUI() {
                listenBtn.style.backgroundColor = "#fbc02d"; 
                listenBtn.style.color = "#000000";
                listenBtn.innerText = "🔴 Listening Active";
            }

            function speakText(text, callback) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.85; 
                    if (callback) { utterance.onend = callback; utterance.onerror = callback; }
                    window.speechSynthesis.speak(utterance);
                } else if (callback) { callback(); }
            }

            function processNextWordInQueue() {
                if (phraseQueue.length === 0) {
                    if (isAutoListening) {
                        statusText.innerText = "Phrase finished! Mic starting...";
                        restartTimer = setTimeout(safeStartListen, 400);
                    }
                    return;
                }

                const wordOptions = phraseQueue.shift();
                optionsContainer.innerHTML = ''; 
                statusText.innerText = `Pick word (${phraseQueue.length + 1} remaining): 👇`;

                wordOptions.forEach(word => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = word;
                    
                    btn.onmouseenter = () => { if (!isListeningActive) speakText(word); };

                    btn.onclick = () => {
                        let formattedWord = word;
                        const currentText = getCurrentText();
                        
                        if (!isEditMode && !isTeacherMode && (currentText.length === 0 || /[.!?]\s*$/.test(currentText))) {
                            formattedWord = formattedWord.charAt(0).toUpperCase() + formattedWord.slice(1);
                        }
                        
                        insertTextAtCursor(formattedWord);
                        optionsContainer.innerHTML = '';
                        setTimeout(processNextWordInQueue, 250);
                    };
                    optionsContainer.appendChild(btn);
                });
            }

            // --- BUTTON HANDLERS --- //
            listenBtn.addEventListener('click', () => {
                optionsContainer.innerHTML = '';
                phraseQueue = [];
                isAutoListening = true;
                warmUpMicrophoneHardware();
                safeStartListen();
            });

            stopBtn.addEventListener('click', () => {
                stopAllListening();
                statusText.innerText = "Listening stopped. Click Start when ready.";
                optionsContainer.innerHTML = '';
            });

            document.getElementById('comma-btn').addEventListener('click', () => { insertTextAtCursor(','); if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300); });
            document.getElementById('period-btn').addEventListener('click', () => { insertTextAtCursor('.'); if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300); });
            document.getElementById('question-btn').addEventListener('click', () => { insertTextAtCursor('?'); if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300); });
            document.getElementById('exclamation-btn').addEventListener('click', () => { insertTextAtCursor('!'); if (isAutoListening) restartTimer = setTimeout(safeStartListen, 300); });

            document.getElementById('undo-btn').addEventListener('click', () => {
                if (isEditMode) {
                    const activeEl = document.querySelector('.active-child-target');
                    if (activeEl && activeEl.classList.contains('child-word')) {
                        activeEl.remove(); // Child can click a word and delete it instantly!
                        renderChildSpans(getCurrentText());
                        statusText.innerText = "Word deleted.";
                        return;
                    }
                }
                
                // Default delete last word
                let text = getCurrentText();
                if (text) {
                    let words = text.split(/\s+/);
                    words.pop();
                    updateSentenceText(words.length > 0 ? words.join(' ') + ' ' : '');
                    statusText.innerText = "Last word removed.";
                }
            });

            document.getElementById('copy-btn').addEventListener('click', () => {
                const text = getCurrentText();
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        const originalText = document.getElementById('copy-btn').innerText;
                        document.getElementById('copy-btn').innerText = "✅ Copied!";
                        setTimeout(() => document.getElementById('copy-btn').innerText = originalText, 2500);
                    });
                }
            });

            document.getElementById('print-btn').addEventListener('click', () => {
                if (getCurrentText()) { window.print(); } else { statusText.innerText = "Nothing to print yet!"; }
            });

            const clearModal = document.getElementById('clear-modal');
            const restoreBtn = document.getElementById('restore-btn');
            document.getElementById('clear-btn').addEventListener('click', () => {
                if (getCurrentText().length > 0) clearModal.style.display = 'flex';
            });
            document.getElementById('confirm-clear-btn').addEventListener('click', () => {
                backupText = getCurrentText();
                updateSentenceText('');
                optionsContainer.innerHTML = '';
                savedCaretRange = null;
                stopAllListening();
                clearModal.style.display = 'none';
                restoreBtn.style.display = 'inline-block';
                statusText.innerText = "Cleared. Use 'Restore' if this was a mistake.";
            });
            document.getElementById('cancel-clear-btn').addEventListener('click', () => { clearModal.style.display = 'none'; });
            restoreBtn.addEventListener('click', () => {
                if (backupText) {
                    updateSentenceText(backupText);
                    restoreBtn.style.display = 'none';
                    statusText.innerText = "Text restored!";
                }
            });

            document.getElementById('read-sentence-btn').addEventListener('click', () => {
                const text = getCurrentText();
                if (text) {
                    const wasAuto = isAutoListening;
                    isAutoListening = false;
                    try { recognition.stop(); } catch(e){}
                    speakText(text, () => { if (wasAuto) { isAutoListening = true; safeStartListen(); } });
                }
            });

            // --- RECOGNITION EVENTS --- //
            recognition.onstart = () => {
                isListeningActive = true;
                updateListeningUI();
                setTimeout(() => { if (isListeningActive) statusText.innerText = "🔴 Listening... Speak now! 👂"; }, 150);
            };

            recognition.onresult = (event) => {
                const results = event.results[0];
                optionsContainer.innerHTML = ''; 
                phraseQueue = [];
                let wordsByPosition = [];

                for (let i = 0; i < results.length; i++) {
                    let transcript = results[i].transcript.trim().toLowerCase().replace(/[.,!?]/g, '');
                    let words = transcript.split(/\s+/).filter(w => w.length > 0);
                    words.forEach((w, pos) => {
                        if (!wordsByPosition[pos]) wordsByPosition[pos] = new Set();
                        wordsByPosition[pos].add(w);
                    });
                }

                phraseQueue = wordsByPosition.map(set => {
                    let choices = Array.from(set);
                    if (choices.length < 3) choices = generateApproximations(choices[0]);
                    return choices.slice(0, 3);
                }).filter(arr => arr.length > 0);

                if (phraseQueue.length > 0) {
                    processNextWordInQueue();
                } else {
                    statusText.innerText = "Didn't catch that. Trying again...";
                    if (isAutoListening) restartTimer = setTimeout(safeStartListen, 500);
                }
            };

            recognition.onerror = (event) => {
                isListeningActive = false;
                if (event.error === 'no-speech') {
                    statusText.innerText = "No speech detected. Listening again...";
                    if (isAutoListening) restartTimer = setTimeout(safeStartListen, 400);
                } else if (event.error !== 'aborted') {
                    statusText.innerText = "Mic status: " + event.error;
                    if (isAutoListening) restartTimer = setTimeout(safeStartListen, 800);
                }
            };

            recognition.onend = () => {
                isListeningActive = false;
                if (phraseQueue.length > 0) {
                    processNextWordInQueue();
                } else if (isAutoListening) {
                    restartTimer = setTimeout(safeStartListen, 300);
                } else {
                    stopListeningUI();
                }
            };
        }
    </script>
</body>
</html>
